<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Mide Simulator — перепродажа телефонов</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230aa2f5'/%3E%3Crect x='10' y='6' width='12' height='20' rx='3.5' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<style>
/* ============================================================
   AVITO FLIP — стили. Мобильный «корпус», светлая тема в духе Авито
   ============================================================ */
:root {
  --bg: #eef1f5;
  --card: #ffffff;
  --ink: #0d0f12;
  --muted: #6b7280;
  --line: #e6e9ee;
  --accent: #0aa2f5;
  --accent-2: #0077c8;
  --accent-soft: #e8f5fe;
  --green: #12a150;
  --green-soft: #e7f7ee;
  --red: #e5484d;
  --red-soft: #fdecec;
  --amber: #e0a000;
  --amber-soft: #fff6dc;
  --violet: #7c5cff;
  --radius: 16px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px rgba(16, 24, 40, .06);
  --safe: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: radial-gradient(1200px 600px at 50% -10%, #dfe9f5 0%, #eef1f5 45%, #e7ebf1 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--ink);
  overscroll-behavior: none;
}

button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }

/* ---------- корпус ---------- */
#app {
  position: relative;
  width: 100%; max-width: 432px; height: 100dvh; max-height: 920px;
  margin: 0 auto;
  background: var(--bg);
  display: flex; flex-direction: column;
  overflow: hidden;
}
/* ---------- шапка ---------- */
.topbar {
  flex: 0 0 auto;
  padding: 10px 14px 8px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  z-index: 20;
}
.topbar-row { display: flex; align-items: center; gap: 8px; }
.logo { display: flex; align-items: center; gap: 7px; font-weight: 800; font-size: 15px; letter-spacing: -.2px; }
.logo-dot {
  width: 22px; height: 22px; border-radius: 7px;
  background: linear-gradient(135deg, #0aa2f5, #7c5cff);
  position: relative; flex: 0 0 auto;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);
}
.logo-dot::after {
  content: ''; position: absolute; inset: 6px; border-radius: 3px;
  border: 2px solid rgba(255,255,255,.92); border-bottom-width: 4px;
}
.spacer { flex: 1; }
.balance {
  display: flex; align-items: baseline; gap: 2px;
  font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums;
  transition: color .25s;
}
.balance small { font-size: 11px; font-weight: 700; color: var(--muted); margin-left: 3px; }
.balance.flash-up { animation: flashUp .7s ease; }
.balance.flash-down { animation: flashDown .7s ease; }
@keyframes flashUp { 0% { color: var(--green); transform: scale(1.12); } 100% { color: var(--ink); transform: none; } }
@keyframes flashDown { 0% { color: var(--red); transform: scale(1.12); } 100% { color: var(--ink); transform: none; } }

.topbar-sub { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 11.5px; color: var(--muted); }
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 999px; background: #f2f4f8;
  font-weight: 650; color: #47505e; white-space: nowrap;
}
.pill.green { background: var(--green-soft); color: var(--green); }
.pill.blue { background: var(--accent-soft); color: var(--accent-2); }
.pill.amber { background: var(--amber-soft); color: #a97900; }
.pill.red { background: var(--red-soft); color: var(--red); }
.icon-btn {
  width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center;
  font-size: 15px; color: #4b5563; background: #f4f6f9;
}
.icon-btn:active { transform: scale(.94); }

/* ---------- контент ---------- */
.content { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 12px 12px 18px; scroll-behavior: smooth; }
.content::-webkit-scrollbar { width: 0; }

.view { display: none; animation: fadeIn .22s ease; }
.view.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.section-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px;
  color: #8b95a5; margin: 4px 2px 8px;
}
.section-title .hint { text-transform: none; letter-spacing: 0; font-weight: 600; color: #9aa3b1; font-size: 11px; }

/* ---------- фильтры ---------- */
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 2px; }
.filters::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; padding: 6px 11px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--line);
  font-size: 12px; font-weight: 650; color: #4b5563; transition: .15s;
}
.chip:active { transform: scale(.96); }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }

/* ---------- карточка объявления ---------- */
.cards { display: flex; flex-direction: column; gap: 9px; }
.card {
  display: flex; gap: 11px; padding: 10px;
  background: var(--card); border-radius: var(--radius); border: 1px solid var(--line);
  box-shadow: 0 1px 1px rgba(16,24,40,.03);
  transition: transform .12s, box-shadow .2s;
  position: relative; overflow: hidden;
}
.card:active { transform: scale(.985); }
.card::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(10,162,245,.07), transparent);
  transform: translateX(-100%);
}
.card.pressed::after { animation: sweep .5s ease; }
@keyframes sweep { to { transform: translateX(100%); } }

.thumb {
  flex: 0 0 74px; width: 74px; height: 88px; border-radius: 12px;
  background: linear-gradient(150deg, #f7f9fc, #e9eef5);
  display: grid; place-items: center; position: relative; overflow: hidden;
}
.phone {
  width: 38px; height: 66px; border-radius: 8px;
  background: linear-gradient(160deg, hsl(var(--hue, 210) 55% 52%), hsl(var(--hue, 210) 60% 30%));
  box-shadow: 0 4px 10px rgba(10, 20, 40, .22), inset 0 0 0 1.5px rgba(255,255,255,.28);
  position: relative;
}
.phone::before {
  content: ''; position: absolute; left: 3px; top: 6px;
  width: 12px; height: 12px; border-radius: 4px;
  background: rgba(8, 12, 20, .55);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
}
.phone::after {
  content: ''; position: absolute; inset: 4px 3px;
  border-radius: 6px; border: 1px solid rgba(255,255,255,.22);
}
.phone.fold { width: 44px; }
.phone.fold::after { inset: 4px 8px; }

.card-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.card-price { font-size: 16px; font-weight: 850; letter-spacing: -.3px; }
.card-title {
  font-size: 12.5px; font-weight: 600; color: #333a45; margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-desc {
  font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-meta { display: flex; align-items: center; gap: 6px; margin-top: auto; padding-top: 6px; font-size: 10.5px; color: #9aa3b1; }
.card-meta .city { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge {
  font-size: 9.5px; font-weight: 800; padding: 2px 6px; border-radius: 6px;
  text-transform: uppercase; letter-spacing: .3px; white-space: nowrap;
}
.badge.deal { background: var(--green-soft); color: var(--green); }
.badge.risky { background: var(--red-soft); color: var(--red); }
.badge.norm { background: var(--accent-soft); color: var(--accent-2); }
.badge.fold { background: #f1ecff; color: var(--violet); }

/* ---------- пустое состояние ---------- */
.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty .big { font-size: 34px; margin-bottom: 8px; opacity: .5; }
.empty b { color: var(--ink); }
.empty p { font-size: 12.5px; line-height: 1.5; margin: 6px 0 0; }

/* ---------- нижние табы ---------- */
.tabbar {
  flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--card); border-top: 1px solid var(--line);
  padding: 6px 4px calc(6px + var(--safe));
  z-index: 20;
}
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 5px 0; border-radius: 10px; color: #9aa3b1; font-size: 10px; font-weight: 650;
  position: relative; transition: .15s;
}
.tab .ic { font-size: 17px; line-height: 1; filter: grayscale(1) opacity(.55); transition: .15s; }
.tab.on { color: var(--accent-2); }
.tab.on .ic { filter: none; }
.tab .dot {
  position: absolute; top: 2px; right: 50%; margin-right: -16px;
  min-width: 15px; height: 15px; border-radius: 99px; background: var(--red); color: #fff;
  font-size: 9px; display: grid; place-items: center; padding: 0 4px; font-weight: 800;
  box-shadow: 0 0 0 2px var(--card);
}

/* ---------- оверлеи ---------- */
.overlay {
  position: absolute; inset: 0; background: var(--bg);
  display: flex; flex-direction: column; z-index: 50;
  transform: translateX(100%); transition: transform .26s cubic-bezier(.32,.72,0,1);
  visibility: hidden;
}
.overlay.open { transform: none; visibility: visible; }
.overlay.up { transform: translateY(100%); }

#ov-meet { z-index: 60; }

.ov-head {
  flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
  padding: 12px 12px; background: var(--card); border-bottom: 1px solid var(--line);
}
.ov-head .back {
  width: 30px; height: 30px; border-radius: 50%; background: #f2f4f8;
  display: grid; place-items: center; font-size: 15px; color: #47505e; flex: 0 0 auto;
}
.ov-title { flex: 1; min-width: 0; overflow: hidden; }
.ov-title > b { display: block; font-size: 13.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ov-title > span { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ov-price { font-weight: 850; font-size: 15px; white-space: nowrap; }
.ov-foot {
  flex: 0 0 auto; display: flex; gap: 8px;
  padding: 10px 12px calc(10px + var(--safe));
  background: var(--card); border-top: 1px solid var(--line);
}
.ov-foot .btn { flex: 1; }

/* ---------- деталь объявления ---------- */
.detail { padding: 12px; overflow-y: auto; flex: 1; }
.photo-big {
  height: 170px; border-radius: var(--radius);
  background: linear-gradient(150deg, #f7f9fc, #e4ebf4);
  display: grid; place-items: center; position: relative; overflow: hidden;
  border: 1px solid var(--line);
}
.photo-big .phone { width: 66px; height: 120px; border-radius: 13px; }
.photo-big .phone::before { width: 19px; height: 19px; left: 5px; top: 9px; border-radius: 6px; }
.photo-big .phone.fold { width: 82px; height: 116px; }
.photo-big .cap {
  position: absolute; left: 10px; bottom: 8px; font-size: 10px; color: #8b95a5; font-weight: 600;
}
.price-row { display: flex; align-items: flex-end; gap: 8px; margin: 14px 2px 4px; }
.price-big { font-size: 26px; font-weight: 900; letter-spacing: -1px; }
.price-sub { font-size: 11.5px; color: var(--muted); padding-bottom: 4px; }
.detail h3 { font-size: 14.5px; margin: 6px 2px 4px; font-weight: 750; }
.detail .desc { font-size: 12.5px; line-height: 1.55; color: #424953; margin: 0 2px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 2px 0; }

.seller-card {
  display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 11px;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
}
.avatar {
  width: 38px; height: 38px; border-radius: 50%; flex: 0 0 auto;
  display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 14px;
  background: linear-gradient(140deg, #6b8cff, #8f5cff);
}
.seller-card .nm { font-size: 12.5px; font-weight: 750; }
.seller-card .sub { font-size: 10.5px; color: var(--muted); margin-top: 1px; }

.defect-line {
  display: flex; align-items: center; gap: 7px; margin-top: 7px;
  font-size: 11.5px; padding: 7px 9px; border-radius: 10px;
  background: var(--red-soft); color: #a3282c; font-weight: 600;
}
.defect-line.ok { background: var(--green-soft); color: #0d7a3c; }
.defect-line.warn { background: var(--amber-soft); color: #8a6500; }

/* ---------- чат ---------- */
.chat-wrap { flex: 1; overflow-y: auto; padding: 12px 12px 6px; display: flex; flex-direction: column; gap: 7px; }
.msg {
  max-width: 82%; padding: 8px 11px; border-radius: 14px;
  font-size: 12.5px; line-height: 1.45; position: relative;
  animation: pop .18s ease;
  white-space: pre-wrap; overflow-wrap: break-word;
}
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
.msg.them { align-self: flex-start; background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 5px; }
.msg.me { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 5px; }
.msg.sys {
  align-self: center; background: #eef2f7; color: #6b7280;
  font-size: 10.5px; padding: 4px 10px; border-radius: 99px; max-width: 92%; text-align: center;
}
.msg.sys.bad { background: var(--red-soft); color: #b03035; }
.msg.sys.good { background: var(--green-soft); color: #0d7a3c; }
.typing { display: inline-flex; gap: 3px; align-items: center; }
.typing i {
  width: 5px; height: 5px; border-radius: 50%; background: #9aa3b1; display: block;
  animation: blink 1.1s infinite;
}
.typing i:nth-child(2) { animation-delay: .18s; }
.typing i:nth-child(3) { animation-delay: .36s; }
@keyframes blink { 0%, 60%, 100% { opacity: .25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-2px); } }

.composer { flex: 0 0 auto; padding: 8px 10px calc(8px + var(--safe)); background: var(--card); border-top: 1px solid var(--line); }
.quick { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 7px; }
.qbtn {
  flex: 0 0 auto; padding: 6px 10px; border-radius: 999px; background: #f2f5f9;
  font-size: 11.5px; font-weight: 650; color: #3d4551; border: 1px solid transparent;
}
.qbtn:active { background: #e6ebf2; }
.qbtn.primary { background: var(--accent-soft); color: var(--accent-2); border-color: #cfe9fb; }
.qbtn.danger { color: var(--red); }
.input-row { display: flex; align-items: flex-end; gap: 7px; }
.input-row input[type=text] {
  flex: 1; min-width: 0; padding: 10px 12px; border-radius: 13px;
  border: 1px solid var(--line); background: #f7f9fc; font-size: 12.5px; outline: none;
  transition: border-color .15s, background .15s;
}
.input-row input[type=text]:focus { border-color: #b9dcf6; background: #fff; }
.send-btn {
  width: 38px; height: 38px; border-radius: 12px; background: var(--accent); color: #fff;
  display: grid; place-items: center; font-size: 15px; flex: 0 0 auto;
  transition: transform .1s;
}
.send-btn:active { transform: scale(.93); }
.send-btn:disabled { background: #cfd6e0; }

/* ---------- встреча ---------- */
.meet-body { flex: 1; overflow-y: auto; padding: 14px; }
.meet-head { text-align: center; margin-bottom: 14px; }
.meet-head .place { font-size: 11px; color: var(--muted); font-weight: 650; }
.meet-head h2 { font-size: 17px; margin: 4px 0 2px; font-weight: 850; letter-spacing: -.3px; }
.meet-head p { font-size: 12px; color: var(--muted); margin: 0; }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.check {
  text-align: left; padding: 10px; border-radius: 13px; background: var(--card);
  border: 1px solid var(--line); transition: .15s; position: relative; overflow: hidden;
}
.check:active { transform: scale(.97); }
.check .ci { font-size: 15px; color: #6b7280; height: 19px; }
.check .ci svg { display: block; }
.check .cn { font-size: 12px; font-weight: 750; margin-top: 3px; }
.check .cd { font-size: 9.5px; color: #9aa3b1; margin-top: 1px; line-height: 1.3; }
.check.done { background: #f6f8fb; }
.check.done .cn { color: #6b7280; }
.check .res { font-size: 10px; margin-top: 4px; font-weight: 700; }
.check .res.bad { color: var(--red); }
.check .res.ok { color: var(--green); }
.check .fee { position: absolute; top: 7px; right: 8px; font-size: 9px; color: var(--amber); font-weight: 800; }
.check.shake { animation: shake .35s; }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }

.meet-summary {
  margin-top: 12px; padding: 12px; border-radius: 14px; background: var(--card);
  border: 1px solid var(--line); font-size: 12px; line-height: 1.5;
}
.meet-actions { display: grid; gap: 8px; margin-top: 12px; }

/* ---------- кнопки ---------- */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  padding: 12px 14px; border-radius: 13px; font-size: 13px; font-weight: 750;
  background: #f1f4f8; color: #333a45; transition: transform .1s, background .15s;
  width: 100%;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: #fff; box-shadow: 0 6px 16px -6px rgba(10,162,245,.6); }
.btn.success { background: var(--green); color: #fff; box-shadow: 0 6px 16px -6px rgba(18,161,80,.55); }
.btn.dark { background: #111418; color: #fff; }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.danger { background: var(--red-soft); color: var(--red); }
.btn.sm { padding: 8px 10px; font-size: 11.5px; border-radius: 10px; }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn-row { display: flex; gap: 8px; }

/* ---------- склад ---------- */
.stock-item {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 11px; margin-bottom: 9px;
}
.stock-top { display: flex; gap: 10px; }
.stock-top .thumb { width: 58px; height: 70px; flex-basis: 58px; }
.stock-top .phone { width: 30px; height: 52px; }
.stock-info { flex: 1; min-width: 0; }
.stock-info .nm { font-size: 13px; font-weight: 750; }
.stock-info .sub { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
.stock-info .val { font-size: 12px; margin-top: 4px; font-weight: 700; color: #333a45; }
.stock-defects { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
.dtag {
  font-size: 9.5px; padding: 3px 7px; border-radius: 6px; font-weight: 700;
  background: #f2f4f8; color: #5b6472;
}
.dtag.bad { background: var(--red-soft); color: #b03035; }
.dtag.warn { background: var(--amber-soft); color: #8a6500; }
.dtag.ok { background: var(--green-soft); color: #0d7a3c; }
.stock-actions { display: flex; gap: 6px; margin-top: 9px; }

/* ---------- модалка ---------- */
.modal-wrap {
  position: absolute; inset: 0; z-index: 90; display: none;
  align-items: flex-end; justify-content: center;
  background: rgba(10, 16, 26, .42); backdrop-filter: blur(2px);
}
.modal-wrap.open { display: flex; animation: fadeIn .16s; }
.modal {
  width: 100%; background: var(--card); border-radius: 22px 22px 0 0;
  padding: 16px 16px calc(18px + var(--safe)); animation: slideUp .24s cubic-bezier(.32,.72,0,1);
  max-height: 86%; overflow-y: auto;
}
@keyframes slideUp { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
.modal h3 { margin: 0 0 4px; font-size: 16px; font-weight: 850; letter-spacing: -.2px; }
.modal .sub { font-size: 11.5px; color: var(--muted); margin-bottom: 14px; line-height: 1.45; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 11px; font-weight: 750; color: #5b6472; margin-bottom: 5px; }
.price-input {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  background: #f7f9fc; border: 1px solid var(--line); border-radius: 13px;
}
.price-input input {
  flex: 1; border: 0; background: none; outline: none;
  font-size: 20px; font-weight: 850; letter-spacing: -.5px; width: 100%;
}
.price-input span { color: var(--muted); font-weight: 700; }
.presets { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.preset { padding: 6px 10px; border-radius: 9px; background: #f2f5f9; font-size: 11.5px; font-weight: 700; color: #3d4551; }
.preset:active { background: #e6ebf2; }
.hint-line { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.45; }
.warn-line { font-size: 11px; color: #a3282c; background: var(--red-soft); padding: 8px 10px; border-radius: 9px; margin-top: 8px; line-height: 1.4; }

/* ---------- тост ---------- */
.toasts {
  position: absolute; left: 12px; right: 12px; top: 66px; z-index: 120;
  display: flex; flex-direction: column; gap: 6px; pointer-events: none;
}
.toast {
  background: rgba(17, 20, 24, .93); color: #fff; padding: 10px 13px; border-radius: 12px;
  font-size: 12px; font-weight: 650; line-height: 1.35;
  box-shadow: 0 10px 28px -8px rgba(0,0,0,.5);
  animation: toastIn .25s cubic-bezier(.32,.72,0,1);
  backdrop-filter: blur(6px);
}
.toast.good { background: rgba(12, 122, 60, .95); }
.toast.bad { background: rgba(190, 40, 45, .95); }
.toast.warn { background: rgba(160, 118, 0, .95); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-10px) scale(.97); } to { opacity: 1; transform: none; } }
.toast.out { animation: toastOut .25s forwards; }
@keyframes toastOut { to { opacity: 0; transform: translateY(-8px); } }

/* ---------- журнал ---------- */
.log-item {
  display: flex; gap: 9px; padding: 9px 10px; background: var(--card);
  border: 1px solid var(--line); border-radius: 12px; margin-bottom: 6px; font-size: 11.5px; line-height: 1.45;
}
.log-item .day { flex: 0 0 auto; font-size: 9.5px; font-weight: 800; color: #9aa3b1; padding-top: 1px; }
.log-item.bad { border-color: #f6d5d6; background: #fffafa; }
.log-item.good { border-color: #d3f0de; background: #fbfffc; }

/* ---------- статистика ---------- */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat {
  background: var(--card); border: 1px solid var(--line); border-radius: 13px; padding: 11px;
}
.stat .k { font-size: 10px; color: var(--muted); font-weight: 650; text-transform: uppercase; letter-spacing: .3px; }
.stat .v { font-size: 18px; font-weight: 850; margin-top: 3px; letter-spacing: -.5px; }
.stat .v.green { color: var(--green); }
.stat .v.red { color: var(--red); }

.mkt-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); margin: 2px 2px 10px; }
.mkt-line b { font-weight: 750; color: #3d4551; }

/* ---------- «ум» собеседника ---------- */
.knows-row { display: flex; align-items: center; gap: 8px; margin: 8px 2px 0; font-size: 11px; color: var(--muted); }
.knows-row > span { flex: 0 0 auto; }
.knows-bar { flex: 0 0 120px; height: 6px; border-radius: 99px; background: #e9edf3; overflow: hidden; }
.knows-bar i { display: block; height: 100%; border-radius: 99px; background: #c9d1dc; }
.knows-bar i.iq-hi { background: var(--green); }
.knows-bar i.iq-mid { background: #e0a000; }
.knows-bar i.iq-lo { background: var(--red); }
.knows-row > b { font-weight: 850; font-size: 11.5px; }
.iq-text b { font-weight: 850; }
.iq-hi { color: var(--green); }
.iq-mid { color: #a97900; }
.iq-lo { color: var(--red); }

/* ---------- картинка аппарата ---------- */
.svg-wrap { display: grid; place-items: center; width: 100%; height: 100%; }
.psvg { display: block; width: 56px; height: 84px; }
.stock-top .thumb .psvg { width: 46px; height: 69px; }
.photo-big .psvg { width: 106px; height: 159px; }
.photo-phone { height: 174px; }
.card-price s { font-size: 11.5px; color: #a2aab7; font-weight: 600; margin-left: 6px; }
.card-mkt { font-size: 10px; color: #98a1af; margin-top: 1px; }
/* ---------- баннер про ИИ ---------- */
.ai-banner {
  display: flex; gap: 10px; align-items: center;
  background: linear-gradient(150deg, #fff8e4, #fffdf8);
  border: 1px solid #f2e0ad; border-radius: 14px;
  padding: 10px 12px; margin-bottom: 10px;
}
.ai-banner .txt { flex: 1; font-size: 11.5px; line-height: 1.45; color: #6b5a2a; }
.ai-banner b { color: #4d3f14; }
.ai-banner button {
  flex: 0 0 auto; padding: 7px 11px; border-radius: 9px;
  background: #f0d68a; color: #4d3f14; font-size: 11px; font-weight: 800;
}
.ai-banner button.x { background: transparent; color: #a89a6e; padding: 4px 6px; font-size: 12px; }
.icon-btn.ai-on { position: relative; }
.icon-btn.ai-on::after {
  content: ''; position: absolute; top: 5px; right: 5px; width: 6px; height: 6px;
  border-radius: 50%; background: var(--green); box-shadow: 0 0 0 2px #f4f6f9;
}

/* ---------- режимы и события ---------- */
.mode-card {
  display: flex; gap: 12px; width: 100%; text-align: left; align-items: flex-start;
  padding: 14px; border-radius: 16px; border: 1px solid var(--line);
  background: #fff; margin-bottom: 10px; transition: .15s;
}
.mode-card:active { transform: scale(.99); }
.mode-card:hover { border-color: #b9dcf6; }
.mode-card .mi {
  width: 42px; height: 42px; border-radius: 12px; flex: 0 0 auto;
  display: grid; place-items: center; font-size: 20px; background: #f2f5f9;
}
.mode-card .mt b { display: block; font-size: 14px; font-weight: 800; }
.mode-card .mt span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
.ev-head {
  width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center;
  font-size: 26px; margin-bottom: 10px;
}
.ev-head.good { background: var(--green-soft); }
.ev-head.bad { background: var(--red-soft); }
.ev-result { font-size: 13px; font-weight: 800; padding: 11px 13px; border-radius: 12px; background: #f6f8fb; }

/* ---------- поиск, профиль, сделки ---------- */
.search-row { margin: 0 0 10px; }
.search-row input {
  width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
  background: #fff; font-size: 12.5px; outline: none; transition: border-color .15s;
}
.search-row input:focus { border-color: #b9dcf6; }

.profile { display: flex; align-items: center; gap: 11px; margin-bottom: 10px; }
.profile .pf .pn { font-size: 14px; font-weight: 850; }
.profile .pf .ps { font-size: 11px; color: var(--muted); margin-top: 2px; }

.main-phone {
  display: flex; align-items: center; gap: 11px; padding: 10px 12px; margin-bottom: 10px;
  background: linear-gradient(150deg, #f7fbff, #fff); border: 1px solid #cfe9fb; border-radius: 14px;
}
.main-phone .psvg { width: 34px; height: 51px; flex: 0 0 auto; }
.main-phone .mpi { flex: 1; min-width: 0; }
.main-phone .mpn { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.main-phone .mps { font-size: 10.5px; color: var(--muted); margin-top: 1px; }

.txn {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 10px;
  padding: 9px 11px; background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; margin-bottom: 6px;
}
.txn .txn-l { display: flex; gap: 7px; align-items: baseline; min-width: 0; }
.txn .txn-day { font-size: 9.5px; font-weight: 800; color: #9aa3b1; flex: 0 0 auto; }
.txn .txn-name { font-size: 12px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.txn .txn-sum { font-size: 12.5px; font-weight: 850; font-variant-numeric: tabular-nums; text-align: right; }
.txn .txn-sub { grid-column: 1; font-size: 10px; color: var(--muted); }
.txn .txn-profit { grid-column: 2; text-align: right; font-size: 11.5px; font-weight: 800; }

/* ---------- цель ---------- */
.goal { background: linear-gradient(150deg, #0d1117, #1b2430); color: #fff; border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.goal .k { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: #8b98a8; font-weight: 700; }
.goal .v { font-size: 21px; font-weight: 900; letter-spacing: -.6px; margin-top: 2px; }
.goal .bar { height: 7px; border-radius: 99px; background: rgba(255,255,255,.12); margin-top: 10px; overflow: hidden; }
.goal .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #0aa2f5, #7c5cff); transition: width .5s; }
.goal .sub { font-size: 10.5px; color: #9aa7b8; margin-top: 6px; }

/* ---------- настройки ---------- */
.row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .txt { flex: 1; }
.row .txt b { display: block; font-size: 12.5px; font-weight: 750; }
.row .txt span { display: block; font-size: 10.5px; color: var(--muted); margin-top: 2px; line-height: 1.35; }
.switch { width: 42px; height: 25px; border-radius: 99px; background: #d8dee7; position: relative; transition: .2s; flex: 0 0 auto; }
.switch::after {
  content: ''; position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: .2s;
}
.switch.on { background: var(--green); }
.switch.on::after { left: 20px; }
.key-input {
  width: 100%; padding: 10px 12px; border-radius: 11px; border: 1px solid var(--line);
  background: #f7f9fc; font-size: 12px; outline: none; font-family: ui-monospace, monospace;
}
.key-status { font-size: 10.5px; margin-top: 6px; color: var(--muted); }
.key-status.ok { color: var(--green); }
.key-status.bad { color: var(--red); }

/* ---------- подсветка цен ---------- */
.pos { color: var(--green); }
.neg { color: var(--red); }
.muted { color: var(--muted); }
.tiny { font-size: 10px; }
.center { text-align: center; }
.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; }
.gone { display: none !important; }

/* ---------- конфетти для профита ---------- */
.deal-flash {
  position: absolute; inset: 0; pointer-events: none; z-index: 110;
  display: grid; align-items: start; justify-items: center; padding-top: 96px;
}
.deal-flash .num {
  font-size: 36px; font-weight: 900; letter-spacing: -2px; color: var(--green);
  text-shadow: 0 8px 30px rgba(18,161,80,.35);
  animation: dealPop .9s cubic-bezier(.2,.8,.3,1) forwards;
}
@keyframes dealPop {
  0% { opacity: 0; transform: scale(.6) translateY(10px); }
  25% { opacity: 1; transform: scale(1.05); }
  70% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(1) translateY(-24px); }
}

/* ============================================================
   ДЕСКТОП: широкий интерфейс вместо телефонной рамки
   ============================================================ */
@media (min-width: 900px) {
  html, body { background: #e9edf3; }
  body { display: block; padding: 0; }
  #app {
    width: 100%; max-width: 1180px; height: 100dvh; max-height: none;
    border-radius: 0; margin: 0 auto;
    box-shadow: 0 0 0 1px var(--line);
  }
  .topbar { padding: 12px 26px; }
  .content { order: 2; padding: 18px 26px 26px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; align-items: start; }
  .tabbar {
    order: 1;
    display: flex; justify-content: flex-start; gap: 4px;
    padding: 6px 22px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    padding-bottom: 6px;
  }
  .tab { flex: 0 0 auto; flex-direction: row; gap: 8px; padding: 8px 14px; border-radius: 10px; font-size: 12px; }
  .tab .ic { font-size: 15px; }
  .tab.on { background: var(--accent-soft); color: var(--accent-2); }
  .tab .dot { position: static; margin: 0 0 0 3px; box-shadow: none; }
  .overlay {
    left: 50%; top: 50%; right: auto; bottom: auto;
    width: min(640px, 94vw); height: min(880px, 92dvh);
    transform: translate(-50%, -50%) scale(.97);
    border-radius: 20px; overflow: hidden;
    box-shadow: 0 0 0 100vmax rgba(12, 18, 28, .48), 0 30px 70px rgba(0, 0, 0, .35);
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .overlay.open { transform: translate(-50%, -50%) scale(1); opacity: 1; visibility: visible; pointer-events: auto; }
  .modal-wrap { align-items: center; }
  .modal { max-width: 520px; border-radius: 20px; margin-bottom: 0; }
  .photo-big { height: 210px; }
  .photo-phone { height: 214px; }
  .photo-big .psvg { width: 128px; height: 192px; }
  .filters { flex-wrap: wrap; overflow: visible; }
  .toasts { left: 50%; right: auto; transform: translateX(-50%); width: min(460px, calc(100% - 32px)); }
  .card:hover { box-shadow: 0 2px 4px rgba(16,24,40,.06), 0 10px 28px rgba(16,24,40,.09); transform: translateY(-1px); }
  .card { cursor: pointer; }
}


/* ============================================================
   MIDE — минимальная тема
   Один акцент (чёрный), тонкие линии, никаких градиентов.
   ============================================================ */
:root {
  --bg: #f6f7f8;
  --card: #ffffff;
  --ink: #0d0e10;
  --muted: #7a8088;
  --line: #e6e8eb;
  --accent: #101113;
  --accent-2: #101113;
  --accent-soft: #eef0f2;
  --green: #12804d;
  --green-soft: #eaf4ee;
  --red: #c0392b;
  --red-soft: #fbeeee;
  --amber: #8a6a1f;
  --amber-soft: #f6f1e4;
  --violet: #5b5bd6;
  --radius: 14px;
  --shadow: none;
}

html, body { background: var(--bg); }
#app { background: var(--bg); }

/* ---------- шапка ---------- */
.topbar { border-bottom: 1px solid var(--line); padding: 12px 14px 9px; }
.logo { font-size: 15px; letter-spacing: -.02em; gap: 5px; }
.logo b { font-weight: 800; }
.logo span { color: var(--muted); font-weight: 500; }
.balance { font-size: 17px; font-weight: 800; letter-spacing: -.03em; }
.icon-btn {
  background: transparent; color: #5b6169; width: 30px; height: 30px;
  border-radius: 8px; transition: background .15s, color .15s;
}
.icon-btn:hover { background: #f0f1f3; }
.icon-btn svg { width: 17px; height: 17px; display: block; }
.icon-btn.ai-on::after { background: var(--green); box-shadow: 0 0 0 2px var(--card); }

.topbar-sub { gap: 6px; font-size: 11.5px; margin-top: 7px; }
.pill {
  background: transparent; padding: 0; border-radius: 0;
  color: var(--muted); font-weight: 500; gap: 0;
}
.facts .pill {
  background: #f1f2f4; color: #4a5057; padding: 4px 9px; border-radius: 7px;
  font-size: 10.5px; font-weight: 650; letter-spacing: .01em;
}
.pill.blue, .pill.green, .pill.amber, .pill.red { background: transparent; color: var(--muted); }
#pill-day { color: var(--ink); font-weight: 700; }
.sep { color: #c3c7cc; font-size: 10px; }
[data-act="next-day"] {
  color: var(--ink); font-weight: 650; font-size: 11.5px;
  padding: 3px 8px; border-radius: 7px; transition: background .15s;
}
[data-act="next-day"]:hover { background: #eceef0; }

/* ---------- контент ---------- */
.content { padding: 14px 12px 20px; }
.section-title {
  font-size: 10.5px; letter-spacing: .09em; color: #9aa0a7; font-weight: 700;
  margin: 6px 2px 10px; text-transform: uppercase;
}
.section-title .hint { color: #b3b8be; font-weight: 500; letter-spacing: 0; }

/* ---------- табы ---------- */
.tabbar { border-top: 1px solid var(--line); background: var(--card); }
.tab { color: #9aa0a7; font-weight: 550; transition: color .15s; position: relative; }
.tab .ic { filter: none; opacity: .55; transition: opacity .15s; }
.tab.on { color: var(--ink); }
.tab.on .ic { opacity: 1; }
.tab .ic svg { width: 19px; height: 19px; display: block; }
.tab::after {
  content: ''; position: absolute; left: 50%; bottom: 2px; height: 2px; width: 0;
  background: var(--ink); border-radius: 2px; transform: translateX(-50%);
  transition: width .22s cubic-bezier(.2,.7,.3,1);
}
.tab.on::after { width: 16px; }
.tab .dot { background: var(--ink); color: #fff; }

/* ---------- фильтры и поиск ---------- */
.chip {
  background: #fff; border: 1px solid var(--line); color: #4a5057;
  font-weight: 600; transition: background .15s, border-color .15s, color .15s;
}
.chip:hover { border-color: #cfd3d8; }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.search-row input {
  background: #fff; border: 1px solid var(--line); color: var(--ink);
  transition: border-color .18s;
}
.search-row input:focus { border-color: #a9aeb5; }
.search-row input::placeholder { color: #a6abb2; }

/* ---------- карточка объявления ---------- */
.card {
  border: 1px solid var(--line); border-radius: 14px; background: #fff;
  box-shadow: none; transition: border-color .18s, transform .18s;
}
.card::after { content: none; }
.card.anim { animation: mideRise .34s cubic-bezier(.2,.7,.3,1) backwards; animation-delay: calc(var(--i, 0) * 16ms); }
@keyframes mideRise {
  from { opacity: 0; transform: translateY(9px); }
  to { opacity: 1; transform: none; }
}
.thumb { background: #f3f4f6; border-radius: 10px; }
.card-price { font-weight: 800; letter-spacing: -.03em; font-size: 16px; }
.card-mkt { color: #9ea4ab; font-size: 10px; }
.card-title { color: #2c3137; font-weight: 600; }
.card-desc { color: #8b9198; }
.card-meta { color: #a2a8ae; }
.badge {
  background: transparent; padding: 0; font-size: 10px; letter-spacing: .02em;
  text-transform: none; font-weight: 700;
}
.badge.deal { background: transparent; color: var(--green); }
.badge.risky { background: transparent; color: var(--red); }
.badge.fold { background: transparent; color: #6b62d6; }
.badge.norm { background: transparent; color: var(--muted); }

/* ---------- кнопки ---------- */
.btn {
  background: #f1f2f4; color: var(--ink); font-weight: 650;
  border-radius: 11px; transition: background .15s, transform .12s, border-color .15s;
}
.btn:hover { background: #e9ebee; }
.btn:active { transform: scale(.985); }
.btn.primary { background: var(--ink); color: #fff; box-shadow: none; }
.btn.primary:hover { background: #24262a; }
.btn.success { background: var(--green); box-shadow: none; }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.ghost:hover { background: #f5f6f7; }
.btn.danger { background: transparent; color: var(--red); border: 1px solid #f0d9d6; }
.btn.danger:hover { background: var(--red-soft); }
.btn:disabled { opacity: .4; }

/* ---------- оверлеи ---------- */
.overlay { background: var(--bg); transition: transform .24s cubic-bezier(.32,.72,0,1), opacity .18s; }
.ov-head { border-bottom: 1px solid var(--line); background: #fff; }
.ov-head .back { background: #f2f3f5; color: #3c4249; transition: background .15s; }
.ov-head .back:hover { background: #e9ebee; }
.ov-price { font-weight: 800; letter-spacing: -.02em; }
.ov-foot { border-top: 1px solid var(--line); background: #fff; }

/* ---------- чат ---------- */
.msg { border-radius: 16px; font-size: 12.5px; }
.msg.them { background: #f1f2f4; border: 0; color: var(--ink); }
.msg.me { background: var(--ink); color: #fff; }
.msg.sys { background: transparent; color: #9aa0a7; font-size: 10.5px; }
.msg.sys.bad { background: var(--red-soft); color: var(--red); }
.msg.sys.good { background: var(--green-soft); color: var(--green); }
.composer { border-top: 1px solid var(--line); background: #fff; }
.input-row input[type=text] {
  background: #f3f4f6; border: 1px solid transparent; transition: border-color .15s, background .15s;
}
.input-row input[type=text]:focus { background: #fff; border-color: #c9cdd3; }
.send-btn { background: var(--ink); border-radius: 11px; }
.send-btn:disabled { background: #d4d7db; }
.qbtn {
  background: #fff; border: 1px solid var(--line); color: #3c4249;
  transition: background .15s, border-color .15s, transform .1s;
}
.qbtn:hover { border-color: #cfd3d8; }
.qbtn:active { transform: scale(.97); }
.qbtn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.qbtn.danger { color: var(--red); }

/* ---------- встреча ---------- */
.check { background: #fff; border: 1px solid var(--line); transition: border-color .15s, background .15s; }
.check:hover { border-color: #cfd3d8; }
.check .ci { color: #9aa0a7; }
.check.done { background: #fafbfc; }
.meet-summary { background: #fff; border: 1px solid var(--line); }

/* ---------- модалки ---------- */
.modal { border-radius: 20px; box-shadow: 0 24px 60px -20px rgba(0,0,0,.35); }
.modal h3 { letter-spacing: -.02em; }
.modal-wrap { background: rgba(12, 14, 18, .38); backdrop-filter: blur(3px); }
.mode-card { border: 1px solid var(--line); border-radius: 14px; transition: border-color .15s, transform .12s; }
.mode-card:hover { border-color: #b9bec5; }
.mode-card:active { transform: scale(.995); }
.mode-card .mi { display: none; }
.ev-head { border-radius: 14px; font-size: 22px; font-weight: 800; }
.ev-head.good { background: var(--green-soft); color: var(--green); }
.ev-head.bad { background: var(--red-soft); color: var(--red); }
.ev-result { background: #f3f4f6; }

/* ---------- склад ---------- */
.stock-item { border: 1px solid var(--line); border-radius: 14px; background: #fff; }
.dtag { background: #f2f3f5; color: #5b6169; }
.dtag.bad { background: var(--red-soft); color: var(--red); }
.dtag.warn { background: var(--amber-soft); color: var(--amber); }
.dtag.ok { background: var(--green-soft); color: var(--green); }
.defect-line { background: var(--red-soft); color: var(--red); border-radius: 10px; }
.defect-line.ok { background: var(--green-soft); color: var(--green); }
.defect-line.warn { background: var(--amber-soft); color: var(--amber); }
.seller-card { border: 1px solid var(--line); background: #fff; }
.avatar { background: #eff0f2; color: #3c4249; font-weight: 800; }
.knows-bar { background: #eef0f2; }
.knows-bar i { background: #c3c7cc; }

/* ---------- профиль и сделки ---------- */
.profile .avatar { background: var(--ink); color: #fff; }
/* аватары собеседников тоже монохромные */
.ov-head .avatar, .seller-card .avatar {
  background: #eef0f2 !important; color: #3c4249 !important;
}
.main-phone { background: #fff; border: 1px solid var(--line); border-radius: 14px; }
.txn { border: 1px solid var(--line); border-radius: 12px; background: #fff; }
.stat { border: 1px solid var(--line); border-radius: 12px; background: #fff; }
.goal { background: var(--ink); border-radius: 16px; box-shadow: none; }
.goal .bar { background: rgba(255,255,255,.16); }
.goal .bar i { background: #fff; }
.log-item { border: 1px solid var(--line); border-radius: 12px; background: #fff; }
.log-item.bad { background: #fff; border-color: #f0d9d6; }
.log-item.good { background: #fff; border-color: #d6ebdf; }

/* ---------- баннер ИИ ---------- */
.ai-banner {
  background: #fff; border: 1px solid var(--line); border-radius: 14px;
  color: #5b6169;
}
.ai-banner b { color: var(--ink); }
.ai-banner button { background: var(--ink); color: #fff; border-radius: 9px; }
.ai-banner button.x { background: transparent; color: #a6abb2; }

/* ---------- тосты ---------- */
.toast {
  background: rgba(15, 16, 18, .94); border-radius: 12px; box-shadow: 0 12px 30px -12px rgba(0,0,0,.5);
  animation: mideToast .28s cubic-bezier(.2,.7,.3,1);
}
@keyframes mideToast { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

/* ---------- пустые состояния ---------- */
.empty .big { display: none; }
.empty b { font-weight: 700; }

/* ---------- движение ---------- */
.view.active { animation: mideView .22s ease; }
@keyframes mideView { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

@media (min-width: 900px) {
  .card:hover { border-color: #c9cdd3; transform: translateY(-1px); }
  .topbar { padding: 14px 28px 11px; }
  .content { padding: 18px 28px 26px; }
  .tabbar { border-bottom: 1px solid var(--line); }
  .tab::after { bottom: 4px; }
  .tab.on { background: transparent; }
  .tab { border-radius: 9px; }
  .tab:hover { background: #f4f5f7; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}


/* ---------- фото телефонов ---------- */
.pphoto {
  display: block;
  max-height: 100%;
  max-width: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  filter: drop-shadow(0 6px 12px rgba(0,0,0,.35));
}
.thumb .pphoto { max-height: 84px; }
.stock-top .thumb .pphoto { max-height: 66px; }

/* ---------- карусель фото ---------- */
.gallery { position: relative; border-radius: 14px; overflow: hidden; background: #f3f4f6; }
.gallery-view { display: flex; transition: transform .32s cubic-bezier(.2,.7,.3,1); }
.gallery-view .slide {
  flex: 0 0 100%;
  height: 210px;
  display: grid;
  place-items: center;
  position: relative;
}
.gallery-view .slide img { max-height: 190px; }
.gallery-view .slide .psvg { width: 124px; height: 186px; }
.gallery-view .slide .crack { position: absolute; inset: 0; pointer-events: none; }
.gallery-nav { position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 6px; pointer-events: none; }
.gallery-nav button {
  pointer-events: auto; width: 30px; height: 30px; border-radius: 50%;

  font-size: 14px; display: grid; place-items: center;
}
.gallery-dots { position: absolute; bottom: 8px; left: 0; right: 0; display: flex; justify-content: center; gap: 5px; }
.gallery-dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(0,0,0,.25); }
.gallery-dots i.on { background: #111; }
.gallery-count { position: absolute; right: 10px; bottom: 8px; font-size: 10px; color: #6b7280; }

/* фото в галерее — одного размера с рисованными */
.gallery-view .slide .pphoto { max-height: 190px; }
.photo-wrap { position: relative; display: inline-block; line-height: 0; }
.photo-wrap .def-layer {
  position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none; border-radius: 10%;
}


/* ---------- фото объявлений ---------- */
.svg-wrap.photo { overflow: hidden; border-radius: 10px; }
.thumb .pphoto { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
.svg-wrap.photo .pphoto { width: 100%; height: 100%; object-fit: cover; }
.listing-photo { width: 100%; height: 100%; display: grid; place-items: center; }
.listing-photo img { max-height: 100%; max-width: 100%; border-radius: 12px; object-fit: contain; }
.gallery-view .slide .listing-photo img { max-height: 190px; }

    let model = weighted(D.MODELS, 'pop');
    if (avoid && avoid.size) {
      for (let i = 0; i < 8 && avoid.has(model.id); i++) model = weighted(D.MODELS, 'pop');
    }
    const storage = pick(model.storages);
    const cosmetic = clamp(rndRange(0.35, 1), 0.2, 1);
    const rawDefects = rollDefects(model, cosmetic);

    const sellerType = weighted(D.SELLER_TYPES, 'w');
    const isMoscow = chance(0.82);
    const city = isMoscow ? 'Москва' : pick(D.CITIES.filter(c => c !== 'Москва'));
    const metro = pick(D.METRO);

    const defects = rawDefects.map(d => ({
      key: d.key,
      disclosed: chance(D.DEFECTS[d.key].visible ? 0.85 : sellerType.honest * 0.7)
    }));
    // «идеальное состояние» иногда пишут даже про битый телефон
    const listing = {
      id: nextId('L'),
      kind: 'buy',
      modelId: model.id,
      storage: storage,
      color: pick(D.COLORS),
      cosmetic: cosmetic,
      defects: defects,
      city: city,
      isMoscow: isMoscow,
      metro: isMoscow ? metro : null,
      photos: rndInt(1, 6),
      createdAt: state.day,
      expires: state.day + rndInt(2, 4),
      seller: {
        name: pick(D.SELLER_NAMES),
        typeId: sellerType.id,
        typeName: sellerType.name,
        patience: sellerType.patience + rndInt(-1, 2),
        honest: sellerType.honest,
        knows: clamp(rndInt(sellerType.knows[0], sellerType.knows[1]), 0, 100)
      },
      neg: { stage: 'chat', patience: Math.max(2, sellerType.patience + rndInt(-1, 2)), lastAsk: 0 },      viewed: false,
      status: 'active'
    };

    const clean = cleanMarket(model, storage);
    const value = phoneValue(listing);
    // жадность продавца: насколько выше рынка он хочет
    const greed = sellerType.id === 'greedy' ? 0.14 : sellerType.id === 'firm' ? 0.1
      : sellerType.id === 'desperate' ? -0.04 : sellerType.id === 'clueless' ? -0.02 : 0.05;
    listing.ask = round100(value * (1 + greed + rndRange(-0.04, 0.09)));

    // «горящая» цена — повод рискнуть
    if (chance(0.07)) listing.ask = round100(value * rndRange(0.62, 0.78));

    const floors = {
      normal: [0.62, 0.74], desperate: [0.48, 0.58], greedy: [0.74, 0.86],
      firm: [0.9, 0.97], pro: [0.64, 0.74], clueless: [0.45, 0.58]
    }[sellerType.id] || [0.62, 0.74];
    listing.sellerMin = round100(value * rndRange(floors[0], floors[1]));
    listing.sellerMin = Math.min(listing.sellerMin, listing.ask);
    listing.sellerFloor = round100(value * 0.42);
    listing.neg.anchor = round100(listing.sellerMin * 1.03); // абсолютный предел уступки
    listing.value = value;
    listing.cleanValue = clean;
    listing.desc = makeDescription(listing);
    return listing;
  }

  function refreshFeed(state, count) {
    state.listings = (state.listings || []).filter(l => l.status === 'active' && l.expires >= state.day);
    const counts = {};
    for (const l of state.listings) counts[l.modelId] = (counts[l.modelId] || 0) + 1;
    const need = (count || 200) - state.listings.length;
    for (let i = 0; i < need; i++) {
      const avoid = new Set(Object.keys(counts).filter(k => counts[k] >= 2));
      const l = generateListing(state, avoid);
      counts[l.modelId] = (counts[l.modelId] || 0) + 1;
      state.listings.push(l);
    }
    state.listings.sort((a, b) => b.createdAt - a.createdAt || rnd() - 0.5);
  }

  /* ---------- торг при покупке ---------- */
  function sellerTextKey(intent) { return intent; }

  // action: {type:'offer', price} | {type:'ask', topic:'defect'|'battery'|'documents'|'price'}
  //         | {type:'meet'} | {type:'leave'} | {type:'accept', price}
  function negotiateBuy(state, listing, action) {
    const neg = listing.neg;
    const out = { intents: [], events: [] };
    if (neg.stage === 'done' || neg.stage === 'lost') return out;

    if (neg.patience <= 0) {
      neg.stage = 'lost';
      out.intents.push({ kind: 'leave', reason: 'patience' });
      return out;
    }

    if (action.type === 'offer') {
      const p = Math.round(action.price);
      if (p <= 0) return out;
      neg.lastOffer = p;

      // «якорь» — цена, которую продавец называет вслух. Он всегда выше
      // настоящего пола, а соглашается чуть ниже якоря. Так игрок никогда
      // не узнаёт точный минимум и не ловит противоречий в диалоге.
      const anchor = neg.anchor || round100(listing.sellerMin * 1.03);
      const iq = clamp((listing.seller.knows == null ? 50 : listing.seller.knows) / 100, 0, 1);
      // чем глупее продавец, тем легче его сбить: он отдаёт почти сразу
      const acceptAt = 0.82 + iq * 0.13;
      const counterAt = 0.60 + iq * 0.16;

      if (p >= Math.round(anchor * acceptAt)) {
        neg.stage = 'agreed';
        neg.agreedPrice = p;
        listing.ask = p;
        out.intents.push({ kind: 'accept', price: p });
        return out;
      }

      if (p >= Math.round(anchor * counterAt)) {
        neg.patience -= 1;
        listing.ask = Math.min(listing.ask, anchor);
        out.intents.push({ kind: 'counter', price: anchor });
      } else {
        const insult = p < anchor * 0.55;
        neg.patience -= insult ? 2 : 1;
        const stubborn = (listing.seller.knows || 50) / 100;
        if (insult && listing.seller.typeId !== 'desperate' && chance(0.35 + stubborn * 0.3)) neg.patience = 0;
        if (neg.patience <= 0) {
          neg.stage = 'lost';
          out.intents.push({ kind: 'leave', reason: insult ? 'offended' : 'patience' });
        } else {
          listing.ask = Math.min(listing.ask, anchor);
          out.intents.push({ kind: 'reject', price: anchor, lowball: insult });
        }
      }
      return out;
    }

    if (action.type === 'ask') {
      neg.patience -= 1;
      const hidden = listing.defects.filter(d => !d.disclosed);
      if (action.topic === 'battery') {
        const b = hidden.find(d => d.key === 'battery');
        if (b && chance(listing.seller.honest + 0.25)) {
          b.disclosed = true;
          listing.desc = makeDescription(listing);
          adjustSellerPrice(listing);
          out.intents.push({ kind: 'defect', defect: 'battery' });
        } else {
          out.intents.push({ kind: 'info', subject: 'battery' });
        }
        return out;
      }
      if (action.topic === 'defect') {
        if (hidden.length && chance(listing.seller.honest * 0.8)) {
          const d = pick(hidden);
          d.disclosed = true;
          listing.desc = makeDescription(listing);
          adjustSellerPrice(listing);
          out.intents.push({ kind: 'defect', defect: d.key });
        } else {
          out.intents.push({ kind: 'info', subject: 'clean' });
        }
        return out;
      }
      if (action.topic === 'documents') {
        out.intents.push({ kind: 'info', subject: 'documents' });
        return out;
      }
      out.intents.push({ kind: 'info', subject: 'clean' });
      return out;
    }

    if (action.type === 'meet') {
      if (!listing.isMoscow) {
        out.intents.push({ kind: 'shipping_only' });
        return out;
      }
      neg.stage = 'meeting';
      out.intents.push({ kind: 'meet', metro: listing.metro });
      return out;
    }

    if (action.type === 'accept') {
      neg.stage = 'agreed';
      neg.agreedPrice = Math.round(action.price || neg.counterPrice || listing.ask);
      out.intents.push({ kind: 'accept', price: neg.agreedPrice });
      return out;
    }

    if (action.type === 'talk') {
      if (chance(0.45)) neg.patience -= 1;
      if (neg.patience <= 0) {
        neg.stage = 'lost';
        out.intents.push({ kind: 'leave', reason: 'patience' });
        return out;
      }
      out.intents.push({ kind: 'talk' });
      return out;
    }

    return out;
  }

  // продавец узнал про дефект — снижает хотелку
  function adjustSellerPrice(listing) {
    const val = phoneValue(listing);
    const ratio = val / Math.max(1, listing.value);
    listing.ask = round100(listing.ask * ratio);
    listing.sellerMin = round100(listing.sellerMin * ratio);
    listing.neg.anchor = round100(listing.sellerMin * 1.03);
    listing.value = val;
  }

  /* ---------- встреча и осмотр ---------- */
  function startMeeting(state, listing) {
    listing.meeting = {
      checks: {},
      found: [],
      stage: 'inspect',
      startedAt: Date.now()
    };
    listing.neg.stage = 'meeting';
    return listing.meeting;
  }

  // возвращает найденные при проверке дефекты
  function runCheck(state, listing, checkId) {
    const mt = listing.meeting;
    if (!mt || mt.checks[checkId]) return [];
    mt.checks[checkId] = true;
    const check = D.CHECKS.find(c => c.id === checkId);
    if (!check) return [];
    if (check.paid) {
      if (state.balance < check.paid) return [{ error: 'no_money' }];
      state.balance -= check.paid;
    }
    const skill = state.skill || 0;
    const found = [];
    for (const d of listing.defects) {
      const def = D.DEFECTS[d.key];
      if (def.check !== checkId) continue;
      if (d.found) continue;
      // шанс заметить: база проверки + скилл
      let p = check.base * (0.45 + skill / 130);
      if (def.visible) p = 0.98;
      if (chance(clamp(p, 0.12, 0.98))) {
        d.found = true;
        d.disclosed = true;
        found.push(d.key);
      }
    }
    for (const k of found) if (!mt.found.includes(k)) mt.found.push(k);
    if (found.length) {
      adjustSellerPrice(listing);
    }
    return found;
  }

  // игрок давит на цену на встрече
  function meetingHaggle(state, listing, price) {
    const neg = listing.neg;
    const anchor = neg.anchor || round100(listing.sellerMin * 1.03);
    const floor = listing.sellerFloor;
    const p = Math.round(price);
    const iq = clamp((listing.seller.knows == null ? 50 : listing.seller.knows) / 100, 0, 1);
    if (p >= Math.round(anchor * (0.82 + iq * 0.13))) {
      neg.stage = 'agreed'; neg.agreedPrice = p;
      return { kind: 'accept', price: p };
    }
    if (p >= Math.max(floor, Math.round(anchor * (0.60 + iq * 0.16)))) {
      neg.patience -= 1;
      if (neg.patience <= 0) { neg.stage = 'lost'; return { kind: 'leave', reason: 'patience' }; }
      listing.ask = Math.min(listing.ask, anchor);
      return { kind: 'counter', price: anchor };
    }
    if (p < floor || neg.patience <= 1) {
      if (chance(0.3)) { neg.stage = 'lost'; return { kind: 'leave', reason: 'lowball' }; }
    }
    neg.patience -= 2;
    listing.ask = Math.min(listing.ask, anchor);
    return { kind: 'reject', price: anchor };
  }

  /* ---------- история сделок ---------- */
  function addDeal(state, deal) {
    state.deals = state.deals || [];
    state.deals.unshift(deal);
    if (state.deals.length > 120) state.deals.length = 120;
  }

  /* ---------- основной телефон ---------- */
  function mainPhone(state) {
    if (!state.mainPhoneId) return null;
    return (state.phones || []).find(p => p.id === state.mainPhoneId) || null;
  }

  function setMainPhone(state, phoneId) {
    const p = (state.phones || []).find(x => x.id === phoneId);
    if (!p) return { ok: false };
    const first = state.mainPhoneId !== phoneId;
    state.mainPhoneId = phoneId;
    if (first) state.rep = clamp(state.rep + 2, 0, 100);
    return { ok: true, first: first, phone: p };
  }

  function repValue(phone) {
    return phoneValue(phone);
  }

  /* ---------- покупка ---------- */
  function buyPhone(state, listing, price) {
    if (state.balance < price) return { ok: false, error: 'no_money' };
    const model = MODELS_BY_ID[listing.modelId];
    state.balance -= price;
    const phone = {
      id: nextId('P'),
      modelId: model.id,
      storage: listing.storage,
      color: listing.color,
      cosmetic: listing.cosmetic,
      tier: model.tier,
      defects: listing.defects.map(d => ({ key: d.key, found: !!d.found, disclosed: !!d.disclosed })),
      boughtFor: price,
      boughtDay: state.day,
      repaired: [],
      listed: false,
      sold: false
    };
    state.phones.push(phone);
    state.stats.bought++;
    state.stats.spent += price;
    addDeal(state, {
      type: 'buy', day: state.day, modelId: model.id, storage: listing.storage,
      color: listing.color, price: price
    });
    listing.status = 'bought';
    state.listings = state.listings.filter(l => l.id !== listing.id);
    for (const d of phone.defects) {
      if (D.DEFECTS[d.key].repair === null && !D.DEFECTS[d.key].cosmetic) {
        pushLog(state, { text: model.name + ': ' + D.DEFECTS[d.key].name + ' — ремонту не подлежит', tone: 'bad' });
      }
    }
    return { ok: true, phone: phone };
  }

  /* ---------- ремонт ---------- */
  function repairOptions(phone) {
    return phone.defects
      .filter(d => D.DEFECTS[d.key].repair !== null)
      .map(d => {
        const tier = MODELS_BY_ID[phone.modelId].tier;
        const base = D.REPAIR_COST[D.DEFECTS[d.key].repair][tier];
        return {
          key: d.key,
          name: D.REPAIR_NAMES[D.DEFECTS[d.key].repair],
          prices: {
            original: round10(base * D.PART_QUALITY.original.mult),
            analog: round10(base * D.PART_QUALITY.analog.mult),
            used: round10(base * D.PART_QUALITY.used.mult)
          }
        };
      });
  }

  function repairPhone(state, phone, defectKey, quality) {
    const opt = repairOptions(phone).find(o => o.key === defectKey);
    if (!opt) return { ok: false, error: 'no_repair' };
    const cost = round10(opt.prices[quality] * effect(state, 'repair'));
    if (state.balance < cost) return { ok: false, error: 'no_money' };
    state.balance -= cost;
    state.stats.repairsCost = (state.stats.repairsCost || 0) + cost;
    phone.defects = phone.defects.filter(d => d.key !== defectKey);
    phone.repaired.push({ key: defectKey, quality: quality, cost: cost, day: state.day });    // аналог и б/у могут «вылезти» после продажи
    const risk = D.PART_QUALITY[quality].risk;
    if (risk > 0 && chance(risk)) {
      phone.pendingRisk = { key: defectKey, chance: risk };
    }
    return { ok: true, cost: cost };
  }

  function scrapPhone(state, phone) {
    const val = round100(phoneValue(phone) * 0.18 * effect(state, 'scrap'));
    state.balance += val;
    state.stats.scrapped = (state.stats.scrapped || 0) + 1;
    if (state.mainPhoneId === phone.id) state.mainPhoneId = null;
    addDeal(state, {
      type: 'scrap', day: state.day, modelId: phone.modelId, storage: phone.storage, color: phone.color,
      price: val
    });
    state.phones = state.phones.filter(p => p.id !== phone.id);
    return { ok: true, value: val };
  }

  /* ---------- свои объявления ---------- */
  function suggestPrice(phone) {
    return Math.max(500, round100(playerValue(phone) * 0.97));
  }

  function listPhone(state, phone, price, disclose) {
    if (state.balance < 0) return { ok: false };
    const model = MODELS_BY_ID[phone.modelId];
    phone.listed = true;
    phone.listPrice = Math.round(price);
    const listing = {
      id: nextId('S'),
      kind: 'sell',
      phoneId: phone.id,
      modelId: phone.modelId,
      storage: phone.storage,
      color: phone.color,
      defects: (disclose === false ? [] : phone.defects.filter(d => d.disclosed || d.found))
        .map(d => ({ key: d.key, disclosed: true })),
      city: 'Москва',
      isMoscow: true,
      ask: phone.listPrice,
      createdAt: state.day,
      views: rndInt(12, 60),
      buyers: [],
      status: 'active',
      desc: model.name + ' ' + phone.storage + ' ГБ, ' + phone.color + '. ' + model.note + '.'
    };
    state.myListings.push(listing);
    return { ok: true, listing: listing };
  }

  function buyerAppears(state, listing) {
    const phone = state.phones.find(p => p.id === listing.phoneId);
    if (!phone) return null;
    const persona = weighted(D.BUYERS, 'w');
    const known = phone.defects.filter(d => d.disclosed || d.found);
    const perceived = perceivedValue(phone, known);
    const budget = round100(perceived * rndRange(persona.budget[0], persona.budget[1]) * (0.97 + (state.rep || 50) / 2000) * effect(state, 'buyer'));
    const b = {
      id: nextId('B'),
      personaId: persona.id,
      personaName: persona.name,
      kind: persona.kind,
      polite: persona.polite,
      patience: persona.patience,
      skill: persona.skill,
      knows: persona.knows,
      haggle: persona.haggle,
      noshow: persona.noshow,
      budget: budget,
      price: listing.ask,
      offer: 0,
      stage: 'chat',
      msgs: 0
    };
    // 50-60% покупателей идут по цене объявления, остальные торгуются
    const agreeShare = 0.5 + clamp((persona.budget[1] - 0.9) * 2, 0, 0.1);
    b.agreesAsIs = chance(agreeShare);
    if (b.agreesAsIs) {
      b.offer = listing.ask;
    } else {
      b.offer = Math.max(300, round100(Math.min(
        listing.ask * (0.70 + (1 - clamp(persona.knows, 0, 1)) * 0.20 + rndRange(-0.03, 0.05)),
        budget * rndRange(0.9, 1.0)
      )));
    }
    listing.buyers.push(b);
    return b;
  }

  function negotiateSell(state, listing, buyer, action) {
    const out = { intents: [], events: [] };
    if (buyer.stage === 'done' || buyer.stage === 'lost') return out;
    if (buyer.patience <= 0) { buyer.stage = 'lost'; out.intents.push({ kind: 'leave' }); return out; }

    const syncPrice = (p) => {
      listing.ask = Math.round(p);
      const ph = state.phones.find(x => x.id === listing.phoneId);
      if (ph) ph.listPrice = listing.ask;
    };

    if (action.type === 'offer') {
      // игрок называет цену
      const p = Math.round(action.price);
      buyer.price = p;
      syncPrice(p);
      if (p > buyer.budget) {
        buyer.patience -= 1;
        out.intents.push({ kind: 'too_expensive', budget: buyer.budget });
        return out;
      }
      if (p <= buyer.offer) {
        buyer.stage = 'agreed';
        buyer.agreedPrice = p;
        syncPrice(p);
        out.intents.push({ kind: 'accept', price: p });
        return out;
      }
      const over = p - buyer.offer;
      const iq = clamp(buyer.knows == null ? 0.5 : buyer.knows, 0, 1);
      // покупатель потупее соглашается почти сразу, умный торгуется до конца
      if (over <= buyer.budget * (0.04 + (1 - iq) * 0.10)) {
        buyer.stage = 'agreed';
        buyer.agreedPrice = p;
        syncPrice(p);
        out.intents.push({ kind: 'accept', price: p });
        return out;
      }
      if (over > buyer.budget * (0.10 + (1 - iq) * 0.30) && buyer.kind !== 'kind') {
        buyer.patience -= 1;
        out.intents.push({ kind: 'reject_price', price: buyer.offer });
        return out;
      }
      const mid = round100((p + buyer.offer) / 2);
      buyer.offer = Math.min(buyer.budget, mid);
      syncPrice(buyer.offer);
      buyer.patience -= 1;
      out.intents.push({ kind: 'counter', price: buyer.offer });
      return out;
    }

    if (action.type === 'accept') {
      buyer.stage = 'agreed';
      buyer.agreedPrice = buyer.offer;
      syncPrice(buyer.offer);
      out.intents.push({ kind: 'accept', price: buyer.offer });
      return out;
    }

    if (action.type === 'meet') {
      buyer.stage = 'meeting';
      out.intents.push({ kind: 'meet' });
      return out;
    }

    if (action.type === 'disclose') {
      const phone = state.phones.find(p => p.id === listing.phoneId);
      const hidden = phone.defects.filter(d => !d.disclosed && !d.found);
      if (hidden.length) {
        const d = hidden[0];
        d.disclosed = true;
        listing.defects.push({ key: d.key, disclosed: true });
        const drop = round100(D.DEFECTS[d.key].priceMult * cleanMarket(MODELS_BY_ID[phone.modelId], phone.storage) * 0.9);
        buyer.budget = Math.max(300, buyer.budget - drop);
        buyer.offer = Math.max(300, buyer.offer - drop);
        out.intents.push({ kind: 'disclosed', defect: d.key, price: buyer.offer });
        return out;
      }
      out.intents.push({ kind: 'nothing_to_disclose' });
      return out;
    }

    if (action.type === 'talk') {
      if (chance(0.4)) buyer.patience -= 1;
      if (buyer.patience <= 0) { buyer.stage = 'lost'; out.intents.push({ kind: 'leave' }); return out; }
      out.intents.push({ kind: 'talk' });
      return out;
    }

    if (action.type === 'push') {
      // «да ладно, бери, хорошая цена»
      buyer.patience -= 1;
      const p = action.price || listing.ask;
      if (buyer.patience <= 0) { buyer.stage = 'lost'; out.intents.push({ kind: 'leave' }); return out; }
      if (p <= buyer.budget && chance(0.35 + (buyer.kind === 'kind' ? 0.2 : 0))) {
        buyer.stage = 'agreed'; buyer.agreedPrice = p;
        out.intents.push({ kind: 'accept', price: p });
      } else {
        out.intents.push({ kind: 'not_buying' });
      }
      return out;
    }
    return out;
  }

  /* ---------- сделка на встрече ---------- */
  function buyerInspects(state, listing, buyer) {
    const phone = state.phones.find(p => p.id === listing.phoneId);
    const hidden = phone.defects.filter(d => !d.disclosed);
    const found = [];
    for (const d of hidden) {
      const p = buyer.skill * (D.DEFECTS[d.key].visible ? 1.4 : 1.0);
      if (chance(clamp(p, 0, 0.95))) {
        d.found = true;   // увидел, но в объявлении дефекта не было
        found.push(d.key);
      }
    }
    return found;
  }

  function completeSale(state, listing, price) {
    const phone = state.phones.find(p => p.id === listing.phoneId);
    if (!phone) return { ok: false };
    state.balance += price;
    state.stats.sold++;
    state.stats.earned += price;
    phone.sold = true;
    phone.soldFor = price;
    listing.status = 'sold';
    state.myListings = state.myListings.filter(l => l.id !== listing.id);
    state.phones = state.phones.filter(p => p.id !== phone.id);

    const profit = price - phone.boughtFor - (phone.repaired || []).reduce((s, r) => s + r.cost, 0);
    state.stats.profit += profit;
    addDeal(state, {
      type: 'sell', day: state.day, modelId: phone.modelId, storage: phone.storage, color: phone.color,
      price: price, boughtFor: phone.boughtFor, repair: (phone.repaired || []).reduce((s, r) => s + r.cost, 0),
      profit: profit
    });
    if (state.mainPhoneId === phone.id) state.mainPhoneId = null;
    if (profit > (state.stats.bestDeal || -1e9)) {
      state.stats.bestDeal = profit;
      state.stats.bestModel = MODELS_BY_ID[phone.modelId].name;
    }

    // репутация: скрыл дефект — либо попался, либо покупатель узнает позже
    const unseen = phone.defects.filter(d => !d.disclosed && !d.found);
    const caught = phone.defects.filter(d => !d.disclosed && d.found);
    if (unseen.length) {
      state.rep = clamp(state.rep - 2, 0, 100);
      const worst = unseen[0];
      // возврат — не приговор: серьёзный скрытый дефект всплывает чаще, мелочь почти никогда
      const risk = clamp(D.DEFECTS[worst.key].priceMult * 0.45 * modeOf(state).returnMult, 0.03, 0.34);
      if (chance(risk)) {
        state.pendingReturns.push({
          day: state.day + 1,
          phone: phone,
          price: price,
          listingId: listing.id,
          defect: worst.key

      }
    } else if (caught.length) {
      state.rep = clamp(state.rep - 1, 0, 100);
    } else {
      state.rep = clamp(state.rep + 1.5, 0, 100);
    }

    if (phone.pendingRisk && chance(phone.pendingRisk.chance)) {
      pushLog(state, { text: 'Из-за дешёвой запчасти покупатель вернёт ' + MODELS_BY_ID[phone.modelId].name, tone: 'bad' });

  function pushLog(state, ev) {

  function advanceDay(state) {

    for (const r of state.pendingReturns) {

        state.balance -= r.price;
        state.rep = clamp(state.rep - 8, 0, 100);
        r.phone.sold = false;
        r.phone.defects = r.phone.defects.filter(d => d.key !== r.defect);
        if (!r.phone.defects.some(d => d.key === r.defect)) {
          r.phone.defects.push({ key: r.defect, found: true, disclosed: true });
        }
        r.phone.listed = false;
        state.phones.push(r.phone);
        events.push({ type: 'return', text: 'Возврат: ' + MODELS_BY_ID[r.phone.modelId].name + ' — покупатель нашёл «' + D.DEFECTS[r.defect].name.toLowerCase() + '» и вернул. −' + r.price + ' ₽', tone: 'bad' });
      } else still.push(r);
    }
    state.pendingReturns = still;

    // истечение объявлений
    state.listings = state.listings.filter(l => l.status === 'active' && l.expires >= state.day);
    refreshFeed(state, 200);

    // событие режима «Интересный»
    if (modeOf(state).eventChance && chance(modeOf(state).eventChance)) {

    }

    // новые покупатели на свои объявления — каждый день по несколько сообщений
    let msgCount = 0;
    for (const l of state.myListings) {
      l.views += rndInt(6, 26);
      const active = (l.buyers || []).filter(b => b.stage !== 'lost' && b.stage !== 'done').length;
      if (active >= 7) continue;
      const n = active >= 4 ? 1 : rndInt(1, 3);
      for (let i = 0; i < n; i++) { buyerAppears(state, l); msgCount++; }
    }
    if (msgCount) events.push({ type: 'messages', text: 'Новые сообщения по объявлениям: ' + msgCount, tone: '' });

    for (const e of events) pushLog(state, e);
    return events;
  }

  /* ---------- РЕЖИМЫ ---------- */
  const MODES = {

      eventChance: 0, returnMult: 1

    risky: {

      note: 'Каждый день что-то происходит: ажиотаж, скидки мастеров, конкуренты, горящие лоты, мошенники.',

    {

    {

      text: 'Конкурент прочёсывает ленту и забирает всё интересное.',
      apply(state) {

      }
    },
    {
      id: 'fine', w: 8, good: false, title: 'Авито списал деньги',
      text: 'Списание за продвижение объявлений.',
      apply(state) {

        state.balance -= s;
        return '−' + s + ' ₽';
      }
    },
    {
      id: 'thief', w: 6, good: false, title: 'Купил краденый',
      text: 'Один из аппаратов на складе оказался с «сюрпризом» — IMEI в чёрном списке.',
      apply(state) {

        const p = state.phones[Math.floor(rnd() * state.phones.length)];

      '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (r * .47).toFixed(1) + '" fill="#18304f"/>' +
