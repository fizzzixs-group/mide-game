  /* ---------- стартовый телефон ----------
     Самый дешёвый аппарат с дефектами: рабочий, но продать его нельзя —
     он всегда основной и всегда остаётся при игроке. */
  function makeStarterPhone(state) {
    // самая дешёвая модель в игре — без фильтров, чтобы точно была минимальная цена
    const model = D.MODELS.slice().sort((a, b) => a.base - b.base)[0];
    const p = {
      id: nextId('P'),
      modelId: model.id,
      storage: Math.min.apply(null, model.storages),
      color: 'чёрный',
      defects: [
        { key: 'battery', level: 1, disclosed: true, found: true },
        { key: 'frame', level: 1, disclosed: true, found: true }
      ],
      cosmetic: 0.55,
      boughtFor: 0,
      boughtAt: 0,
      isStart: true,
      sealed: true,
      repaired: [],
      main: true
    };
    return p;
  }

  function generateListing(state, avoid) {
    let model = pickModel();
    if (avoid && avoid.size) {
      for (let i = 0; i < 8 && avoid.has(model.id); i++) model = pickModel();
    }
    const storage = pick(model.storages);
    const cosmetic = clamp(rndRange(0.35, 1), 0.2, 1);
    const rawDefects = rollDefects(model, cosmetic);

    const sellerType = weighted(D.SELLER_TYPES, 'w');
    const isMoscow = chance(0.82);
    const city = isMoscow ? 'Москва' : pick(D.CITIES.filter(c => c !== 'Москва'));
    const metro = pick(D.METRO);

    const defects = rawDefects.map(d => ({
      key: d.key,
      disclosed: chance(D.DEFECTS[d.key].visible ? 0.85 : sellerType.honest * 0.7)
    }));
    // «идеальное состояние» иногда пишут даже про битый телефон
    const listing = {
      id: nextId('L'),
      kind: 'buy',
      desk: Math.floor(Math.random() * 9),
      modelId: model.id,
      storage: storage,
      color: pick(D.COLORS),
      cosmetic: cosmetic,
      defects: defects,
      city: city,
      isMoscow: isMoscow,
      metro: isMoscow ? metro : null,
      photos: rndInt(1, 6),
      createdAt: state.day,
      expires: state.day + rndInt(2, 4),
      seller: {
        name: pick(D.SELLER_NAMES),
        typeId: sellerType.id,
        typeName: sellerType.name,
        patience: sellerType.patience + rndInt(-1, 2),
        honest: sellerType.honest,
        knows: clamp(rndInt(sellerType.knows[0], sellerType.knows[1]), 0, 100)
      },
      neg: { stage: 'chat', patience: Math.max(2, sellerType.patience + rndInt(-1, 2)), lastAsk: 0 },      viewed: false,
      status: 'active'
    };

    const clean = cleanMarket(model, storage);
    const value = phoneValue(listing);
    // жадность продавца: насколько выше рынка он хочет
    const greed = sellerType.id === 'greedy' ? 0.14 : sellerType.id === 'firm' ? 0.1
      : sellerType.id === 'desperate' ? -0.04 : sellerType.id === 'clueless' ? -0.02 : 0.05;
    listing.ask = round100(value * (1 + greed + rndRange(-0.04, 0.09)));

    // «горящая» цена — повод рискнуть
    if (chance(0.07)) listing.ask = round100(value * rndRange(0.62, 0.78));

    const floors = {
      normal: [0.62, 0.74], desperate: [0.48, 0.58], greedy: [0.74, 0.86],
      firm: [0.9, 0.97], pro: [0.64, 0.74], clueless: [0.45, 0.58]
    }[sellerType.id] || [0.62, 0.74];
    listing.sellerMin = round100(value * rndRange(floors[0], floors[1]));
    listing.sellerMin = Math.min(listing.sellerMin, listing.ask);
    listing.sellerFloor = round100(value * 0.42);
    listing.neg.anchor = round100(listing.sellerMin * 1.03); // абсолютный предел уступки
    listing.value = value;
    listing.cleanValue = clean;
    listing.desc = makeDescription(listing);
    return listing;
  }

  function refreshFeed(state, count) {
    state.listings = (state.listings || []).filter(l => l.status === 'active' && l.expires >= state.day);
    const counts = {};
    for (const l of state.listings) counts[l.modelId] = (counts[l.modelId] || 0) + 1;
    const need = (count || 200) - state.listings.length;
    for (let i = 0; i < need; i++) {
      const avoid = new Set(Object.keys(counts).filter(k => counts[k] >= 2));
      const l = generateListing(state, avoid);
      counts[l.modelId] = (counts[l.modelId] || 0) + 1;
      state.listings.push(l);
    }
    state.listings.sort((a, b) => b.createdAt - a.createdAt || rnd() - 0.5);
  }

  /* ---------- торг при покупке ---------- */
  function sellerTextKey(intent) { return intent; }

  // action: {type:'offer', price} | {type:'ask', topic:'defect'|'battery'|'documents'|'price'}
  //         | {type:'meet'} | {type:'leave'} | {type:'accept', price}
  function negotiateBuy(state, listing, action) {
    const neg = listing.neg;
    const out = { intents: [], events: [] };
    if (neg.stage === 'done' || neg.stage === 'lost') return out;

    if (neg.patience <= 0) {
      neg.stage = 'lost';
      out.intents.push({ kind: 'leave', reason: 'patience' });
      return out;
    }

    if (action.type === 'offer') {
      const p = Math.round(action.price);
      if (p <= 0) return out;
      neg.lastOffer = p;

      // «якорь» — цена, которую продавец называет вслух. Он всегда выше
      // настоящего пола, а соглашается чуть ниже якоря. Так игрок никогда
      // не узнаёт точный минимум и не ловит противоречий в диалоге.
      const anchor = neg.anchor || round100(listing.sellerMin * 1.03);
      const iq = clamp((listing.seller.knows == null ? 50 : listing.seller.knows) / 100, 0, 1);
      // чем глупее продавец, тем легче его сбить: он отдаёт почти сразу
      const acceptAt = 0.82 + iq * 0.13;
      const counterAt = 0.60 + iq * 0.16;

      if (p >= Math.round(anchor * acceptAt)) {
        neg.stage = 'agreed';
        neg.agreedPrice = p;
        listing.ask = p;
        out.intents.push({ kind: 'accept', price: p });
        return out;
      }

      if (p >= Math.round(anchor * counterAt)) {
        neg.patience -= 1;
        listing.ask = Math.min(listing.ask, anchor);
        out.intents.push({ kind: 'counter', price: anchor });
      } else {
        const insult = p < anchor * 0.55;
        neg.patience -= insult ? 2 : 1;
        const stubborn = (listing.seller.knows || 50) / 100;
        if (insult && listing.seller.typeId !== 'desperate' && chance(0.35 + stubborn * 0.3)) neg.patience = 0;
        if (neg.patience <= 0) {
          neg.stage = 'lost';
          out.intents.push({ kind: 'leave', reason: insult ? 'offended' : 'patience' });
        } else {
          listing.ask = Math.min(listing.ask, anchor);
          out.intents.push({ kind: 'reject', price: anchor, lowball: insult });
        }
      }
      return out;
    }

    if (action.type === 'ask') {
      neg.patience -= 1;
      const hidden = listing.defects.filter(d => !d.disclosed);
      if (action.topic === 'battery') {
        const b = hidden.find(d => d.key === 'battery');
        if (b && chance(listing.seller.honest + 0.25)) {
          b.disclosed = true;
          listing.desc = makeDescription(listing);
          adjustSellerPrice(listing);
          out.intents.push({ kind: 'defect', defect: 'battery' });
        } else {
          out.intents.push({ kind: 'info', subject: 'battery' });
        }
        return out;
      }
      if (action.topic === 'defect') {
        if (hidden.length && chance(listing.seller.honest * 0.8)) {
          const d = pick(hidden);
          d.disclosed = true;
          listing.desc = makeDescription(listing);
          adjustSellerPrice(listing);
          out.intents.push({ kind: 'defect', defect: d.key });
        } else {
          out.intents.push({ kind: 'info', subject: 'clean' });
        }
        return out;
      }
      if (action.topic === 'documents') {
        out.intents.push({ kind: 'info', subject: 'documents' });
        return out;
      }
      out.intents.push({ kind: 'info', subject: 'clean' });
      return out;
    }

    if (action.type === 'meet') {
      if (!listing.isMoscow) {
        out.intents.push({ kind: 'shipping_only' });
        return out;
      }
      neg.stage = 'meeting';
      out.intents.push({ kind: 'meet', metro: listing.metro });
      return out;
    }

    if (action.type === 'accept') {
      neg.stage = 'agreed';
      neg.agreedPrice = Math.round(action.price || neg.counterPrice || listing.ask);
      out.intents.push({ kind: 'accept', price: neg.agreedPrice });
      return out;
    }

    if (action.type === 'talk') {
      if (chance(0.45)) neg.patience -= 1;
      if (neg.patience <= 0) {
        neg.stage = 'lost';
        out.intents.push({ kind: 'leave', reason: 'patience' });
        return out;
      }
      out.intents.push({ kind: 'talk' });
      return out;
    }

    return out;
  }

  // продавец узнал про дефект — снижает хотелку
  function adjustSellerPrice(listing) {
    const val = phoneValue(listing);
    const ratio = val / Math.max(1, listing.value);
    listing.ask = round100(listing.ask * ratio);
    listing.sellerMin = round100(listing.sellerMin * ratio);
    listing.neg.anchor = round100(listing.sellerMin * 1.03);
    listing.value = val;
  }

  /* ---------- встреча и осмотр ---------- */
  function startMeeting(state, listing) {
    listing.meeting = {
      checks: {},
      found: [],
      stage: 'inspect',
      startedAt: Date.now()
    };
    listing.neg.stage = 'meeting';
    return listing.meeting;
  }

  // возвращает найденные при проверке дефекты
  function runCheck(state, listing, checkId) {
    const mt = listing.meeting;
    if (!mt || mt.checks[checkId]) return [];
    mt.checks[checkId] = true;
    const check = D.CHECKS.find(c => c.id === checkId);
    if (!check) return [];
    if (check.paid) {
      if (state.balance < check.paid) return [{ error: 'no_money' }];
      state.balance -= check.paid;
    }
    const skill = state.skill || 0;
    const found = [];
    for (const d of listing.defects) {
      const def = D.DEFECTS[d.key];
      if (def.check !== checkId) continue;
      if (d.found) continue;
      // шанс заметить: база проверки + скилл
      let p = check.base * (0.45 + skill / 130);
      if (def.visible) p = 0.98;
      if (chance(clamp(p, 0.12, 0.98))) {
        d.found = true;
        d.disclosed = true;
        found.push(d.key);
      }
    }
    for (const k of found) if (!mt.found.includes(k)) mt.found.push(k);
    if (found.length) {
      adjustSellerPrice(listing);
    }
    return found;
  }

  // игрок давит на цену на встрече
  function meetingHaggle(state, listing, price) {
    const neg = listing.neg;
    const anchor = neg.anchor || round100(listing.sellerMin * 1.03);
    const floor = listing.sellerFloor;
    const p = Math.round(price);
    const iq = clamp((listing.seller.knows == null ? 50 : listing.seller.knows) / 100, 0, 1);
    if (p >= Math.round(anchor * (0.82 + iq * 0.13))) {
      neg.stage = 'agreed'; neg.agreedPrice = p;
      return { kind: 'accept', price: p };
    }
    if (p >= Math.max(floor, Math.round(anchor * (0.60 + iq * 0.16)))) {
      neg.patience -= 1;
      if (neg.patience <= 0) { neg.stage = 'lost'; return { kind: 'leave', reason: 'patience' }; }
      listing.ask = Math.min(listing.ask, anchor);
      return { kind: 'counter', price: anchor };
    }
    if (p < floor || neg.patience <= 1) {
      if (chance(0.3)) { neg.stage = 'lost'; return { kind: 'leave', reason: 'lowball' }; }
    }
    neg.patience -= 2;
    listing.ask = Math.min(listing.ask, anchor);
    return { kind: 'reject', price: anchor };
  }

  /* ---------- история сделок ---------- */
  function addDeal(state, deal) {
    state.deals = state.deals || [];
    state.deals.unshift(deal);
    if (state.deals.length > 120) state.deals.length = 120;
  }

  /* ---------- основной телефон ---------- */
  function mainPhone(state) {
    if (!state.mainPhoneId) return null;
    return (state.phones || []).find(p => p.id === state.mainPhoneId) || null;
  }

  function setMainPhone(state, phoneId) {
    const p = (state.phones || []).find(x => x.id === phoneId);
    if (!p) {
      return { ok: false, reason: 'none', message: 'Телефона нет в складе — метку поставить некуда.' };
    }
    const first = state.mainPhoneId !== phoneId;
    state.mainPhoneId = phoneId;
    if (first) state.rep = clamp(state.rep + 2, 0, 100);
    return { ok: true, first: first, phone: p };
  }

  function repValue(phone) {
    return phoneValue(phone);
  }

  /* ---------- покупка ---------- */
  function buyPhone(state, listing, price) {
    if (state.balance < price) return { ok: false, error: 'no_money' };
    const model = MODELS_BY_ID[listing.modelId];
    state.balance -= price;
    const phone = {
      id: nextId('P'),
      modelId: model.id,
      storage: listing.storage,
      color: listing.color,
      cosmetic: listing.cosmetic,
      tier: model.tier,
      defects: listing.defects.map(d => ({ key: d.key, found: !!d.found, disclosed: !!d.disclosed })),
      boughtFor: price,
      boughtDay: state.day,
      repaired: [],
      listed: false,
      sold: false
    };
    state.phones.push(phone);
    state.stats.bought++;
    state.stats.spent += price;
    addDeal(state, {
      type: 'buy', day: state.day, modelId: model.id, storage: listing.storage,
      color: listing.color, price: price
    });
    listing.status = 'bought';
    state.listings = state.listings.filter(l => l.id !== listing.id);
    for (const d of phone.defects) {
      if (!D.DEFECTS[d.key] || (D.DEFECTS[d.key].repair === null && !D.DEFECTS[d.key].cosmetic)) {
        pushLog(state, { text: model.name + ': ' + D.DEFECTS[d.key].name + ' — ремонту не подлежит', tone: 'bad' });
      }
    }
    return { ok: true, phone: phone };
  }

  /* ---------- ремонт ---------- */
  function repairOptions(phone) {
    return (phone.defects || [])
      // ключ дефекта может быть неизвестен (старые сохранения, свои пометки)
      .filter(d => d && D.DEFECTS[d.key] && D.DEFECTS[d.key].repair !== null)
      .map(d => {
        const tier = MODELS_BY_ID[phone.modelId].tier;
        const base = D.REPAIR_COST[D.DEFECTS[d.key].repair][tier];
        return {
          key: d.key,
          name: D.REPAIR_NAMES[D.DEFECTS[d.key].repair],
          prices: {
            original: round10(base * D.PART_QUALITY.original.mult),
            analog: round10(base * D.PART_QUALITY.analog.mult),
            used: round10(base * D.PART_QUALITY.used.mult)
          }
        };
      });
  }

  function repairPhone(state, phone, defectKey, quality) {
    const opt = repairOptions(phone).find(o => o.key === defectKey);
    if (!opt) return { ok: false, error: 'no_repair' };
    const cost = round10(opt.prices[quality] * effect(state, 'repair'));
    if (state.balance < cost) return { ok: false, error: 'no_money' };
    state.balance -= cost;
    state.stats.repairsCost = (state.stats.repairsCost || 0) + cost;
    phone.defects = phone.defects.filter(d => d.key !== defectKey);
    phone.repaired.push({ key: defectKey, quality: quality, cost: cost, day: state.day });    // аналог и б/у могут «вылезти» после продажи
    const risk = D.PART_QUALITY[quality].risk;
    if (risk > 0 && chance(risk)) {
      phone.pendingRisk = { key: defectKey, chance: risk };
    }
    return { ok: true, cost: cost };
  }

  function scrapPhone(state, phone) {
    if (state.mainPhoneId === phone.id) {
      return { ok: false, reason: 'main', message: 'Это твой основной телефон — его нельзя сдать в разбор. Сначала переставь метку на другой аппарат.' };
    }
    const val = round100(phoneValue(phone) * 0.18 * effect(state, 'scrap'));
    state.balance += val;
    state.stats.scrapped = (state.stats.scrapped || 0) + 1;
    if (state.mainPhoneId === phone.id) state.mainPhoneId = null;
    addDeal(state, {
      type: 'scrap', day: state.day, modelId: phone.modelId, storage: phone.storage, color: phone.color,
      price: val
    });
    state.phones = state.phones.filter(p => p.id !== phone.id);
    return { ok: true, value: val };
  }

  /* ---------- свои объявления ---------- */
  function suggestPrice(phone) {
    return Math.max(500, round100(playerValue(phone) * 0.97));
  }

  function listPhone(state, phone, price, disclose) {
    if (state.mainPhoneId === phone.id) {
      return { ok: false, reason: 'main', message: 'Основной телефон нельзя выставить на продажу — сначала переставь метку на другой аппарат.' };
    }
    if (state.balance < 0) return { ok: false };
    const model = MODELS_BY_ID[phone.modelId];
    phone.listed = true;
    phone.listPrice = Math.round(price);
    const listing = {
      id: nextId('S'),
      kind: 'sell',
      phoneId: phone.id,
      modelId: phone.modelId,
      storage: phone.storage,
      color: phone.color,
      defects: (disclose === false ? [] : phone.defects.filter(d => d.disclosed || d.found))
        .map(d => ({ key: d.key, disclosed: true })),
      city: 'Москва',
      isMoscow: true,
      ask: phone.listPrice,
      createdAt: state.day,
      views: rndInt(12, 60),
      buyers: [],
      status: 'active',
      desc: model.name + ' ' + phone.storage + ' ГБ, ' + phone.color + '. ' + model.note + '.'
    };
    state.myListings.push(listing);
    return { ok: true, listing: listing };
  }

  function buyerAppears(state, listing) {
    const phone = state.phones.find(p => p.id === listing.phoneId);
    if (!phone) return null;
    const persona = weighted(D.BUYERS, 'w');
    const known = phone.defects.filter(d => d.disclosed || d.found);
    const perceived = perceivedValue(phone, known);
    const budget = round100(perceived * rndRange(persona.budget[0], persona.budget[1]) * (0.97 + (state.rep || 50) / 2000) * effect(state, 'buyer'));
    const b = {
      id: nextId('B'),
      personaId: persona.id,
      personaName: persona.name,
      kind: persona.kind,
      polite: persona.polite,
      patience: persona.patience,
      skill: persona.skill,
      knows: persona.knows,
      haggle: persona.haggle,
      noshow: persona.noshow,
      budget: budget,
      price: listing.ask,
      offer: 0,
      stage: 'chat',
      msgs: 0
    };
    // 50-60% покупателей идут по цене объявления, остальные торгуются
    const agreeShare = 0.5 + clamp((persona.budget[1] - 0.9) * 2, 0, 0.1);
    b.agreesAsIs = chance(agreeShare);
    if (b.agreesAsIs) {
      b.offer = listing.ask;
    } else {
      b.offer = Math.max(300, round100(Math.min(
        listing.ask * (0.70 + (1 - clamp(persona.knows, 0, 1)) * 0.20 + rndRange(-0.03, 0.05)),
        budget * rndRange(0.9, 1.0)
      )));
    }
    listing.buyers.push(b);
    return b;
  }

  function negotiateSell(state, listing, buyer, action) {
    const out = { intents: [], events: [] };
    if (buyer.stage === 'done' || buyer.stage === 'lost') return out;
    if (buyer.patience <= 0) { buyer.stage = 'lost'; out.intents.push({ kind: 'leave' }); return out; }

    const syncPrice = (p) => {
      listing.ask = Math.round(p);
      const ph = state.phones.find(x => x.id === listing.phoneId);
      if (ph) ph.listPrice = listing.ask;
    };

    if (action.type === 'offer') {
      // игрок называет цену
      const p = Math.round(action.price);
      buyer.price = p;
      syncPrice(p);
      if (p > buyer.budget) {
        buyer.patience -= 1;
        out.intents.push({ kind: 'too_expensive', budget: buyer.budget });
        return out;
      }
      if (p <= buyer.offer) {
        buyer.stage = 'agreed';
        buyer.agreedPrice = p;
        syncPrice(p);
        out.intents.push({ kind: 'accept', price: p });
        return out;
      }
      const over = p - buyer.offer;
      const iq = clamp(buyer.knows == null ? 0.5 : buyer.knows, 0, 1);
      // покупатель потупее соглашается почти сразу, умный торгуется до конца
      if (over <= buyer.budget * (0.04 + (1 - iq) * 0.10)) {
        buyer.stage = 'agreed';
        buyer.agreedPrice = p;
        syncPrice(p);
        out.intents.push({ kind: 'accept', price: p });
        return out;
      }
      if (over > buyer.budget * (0.10 + (1 - iq) * 0.30) && buyer.kind !== 'kind') {
        buyer.patience -= 1;
        out.intents.push({ kind: 'reject_price', price: buyer.offer });
        return out;
      }
      const mid = round100((p + buyer.offer) / 2);
      buyer.offer = Math.min(buyer.budget, mid);
      syncPrice(buyer.offer);
      buyer.patience -= 1;
      out.intents.push({ kind: 'counter', price: buyer.offer });
      return out;
    }

    if (action.type === 'accept') {
      buyer.stage = 'agreed';
      buyer.agreedPrice = buyer.offer;
      syncPrice(buyer.offer);
      out.intents.push({ kind: 'accept', price: buyer.offer });
      return out;
    }

    if (action.type === 'meet') {
      buyer.stage = 'meeting';
      out.intents.push({ kind: 'meet' });
      return out;
    }

    if (action.type === 'disclose') {
      const phone = state.phones.find(p => p.id === listing.phoneId);
      const hidden = phone.defects.filter(d => !d.disclosed && !d.found);
      if (hidden.length) {
        const d = hidden[0];
        d.disclosed = true;
        listing.defects.push({ key: d.key, disclosed: true });
        const drop = round100(D.DEFECTS[d.key].priceMult * cleanMarket(MODELS_BY_ID[phone.modelId], phone.storage) * 0.9);
        buyer.budget = Math.max(300, buyer.budget - drop);
        buyer.offer = Math.max(300, buyer.offer - drop);
        out.intents.push({ kind: 'disclosed', defect: d.key, price: buyer.offer });
        return out;
      }
      out.intents.push({ kind: 'nothing_to_disclose' });
      return out;
    }

    if (action.type === 'talk') {
      if (chance(0.4)) buyer.patience -= 1;
      if (buyer.patience <= 0) { buyer.stage = 'lost'; out.intents.push({ kind: 'leave' }); return out; }
      out.intents.push({ kind: 'talk' });
      return out;
    }

    if (action.type === 'push') {
      // «да ладно, бери, хорошая цена»
      buyer.patience -= 1;
      const p = action.price || listing.ask;
      if (buyer.patience <= 0) { buyer.stage = 'lost'; out.intents.push({ kind: 'leave' }); return out; }
      if (p <= buyer.budget && chance(0.35 + (buyer.kind === 'kind' ? 0.2 : 0))) {
        buyer.stage = 'agreed'; buyer.agreedPrice = p;
        out.intents.push({ kind: 'accept', price: p });
      } else {
        out.intents.push({ kind: 'not_buying' });
      }
      return out;
    }
    return out;
  }

  /* ---------- сделка на встрече ---------- */
  function buyerInspects(state, listing, buyer) {
    const phone = state.phones.find(p => p.id === listing.phoneId);
    const hidden = phone.defects.filter(d => !d.disclosed);
    const found = [];
    for (const d of hidden) {
      const p = buyer.skill * (D.DEFECTS[d.key].visible ? 1.4 : 1.0);
      if (chance(clamp(p, 0, 0.95))) {
        d.found = true;   // увидел, но в объявлении дефекта не было
        found.push(d.key);
      }
    }
    return found;
  }

  function completeSale(state, listing, price) {
    const phone = state.phones.find(p => p.id === listing.phoneId);
    if (!phone) return { ok: false };
    state.balance += price;
    state.stats.sold++;
    state.stats.earned += price;
    phone.sold = true;
    phone.soldFor = price;
    listing.status = 'sold';
    state.myListings = state.myListings.filter(l => l.id !== listing.id);
    state.phones = state.phones.filter(p => p.id !== phone.id);

    const profit = price - phone.boughtFor - (phone.repaired || []).reduce((s, r) => s + r.cost, 0);
    state.stats.profit += profit;
    addDeal(state, {
      type: 'sell', day: state.day, modelId: phone.modelId, storage: phone.storage, color: phone.color,
      price: price, boughtFor: phone.boughtFor, repair: (phone.repaired || []).reduce((s, r) => s + r.cost, 0),
      profit: profit
    });
    if (state.mainPhoneId === phone.id) state.mainPhoneId = null;
    if (profit > (state.stats.bestDeal || -1e9)) {
      state.stats.bestDeal = profit;
      state.stats.bestModel = MODELS_BY_ID[phone.modelId].name;
    }

    // репутация: скрыл дефект — либо попался, либо покупатель узнает позже
    const unseen = phone.defects.filter(d => !d.disclosed && !d.found);
    const caught = phone.defects.filter(d => !d.disclosed && d.found);
    if (unseen.length) {
      state.rep = clamp(state.rep - 2, 0, 100);
      const worst = unseen[0];
      // возврат — не приговор: серьёзный скрытый дефект всплывает чаще, мелочь почти никогда
      const risk = clamp(D.DEFECTS[worst.key].priceMult * 0.45 * modeOf(state).returnMult, 0.03, 0.34);
      if (chance(risk)) {
        state.pendingReturns.push({
          day: state.day + 1,
          phone: phone,
          price: price,
          listingId: listing.id,
          defect: worst.key
        });
      }
    } else if (caught.length) {
      state.rep = clamp(state.rep - 1, 0, 100);
    } else {
      state.rep = clamp(state.rep + 1.5, 0, 100);
    }

    // если запчасть была «аналог» с риском — лотерея
    if (phone.pendingRisk && chance(phone.pendingRisk.chance)) {
      pushLog(state, { text: 'Из-за дешёвой запчасти покупатель вернёт ' + MODELS_BY_ID[phone.modelId].name, tone: 'bad' });
    }

    return { ok: true, profit: profit };
  }

  /* ---------- дни и события ---------- */
  function pushLog(state, ev) {
    ev.day = state.day;
    ev.id = nextId('E');
    state.log.unshift(ev);
    if (state.log.length > 80) state.log.length = 80;
  }

  function advanceDay(state) {
    const events = [];
    state.day++;

    // возвраты
    const still = [];
    for (const r of state.pendingReturns) {
      if (r.day <= state.day) {
        state.balance -= r.price;
        state.rep = clamp(state.rep - 8, 0, 100);
        r.phone.sold = false;
        r.phone.defects = r.phone.defects.filter(d => d.key !== r.defect);
        if (!r.phone.defects.some(d => d.key === r.defect)) {
          r.phone.defects.push({ key: r.defect, found: true, disclosed: true });
        }
        r.phone.listed = false;
        state.phones.push(r.phone);
        events.push({ type: 'return', text: 'Возврат: ' + MODELS_BY_ID[r.phone.modelId].name + ' — покупатель нашёл «' + D.DEFECTS[r.defect].name.toLowerCase() + '» и вернул. −' + r.price + ' ₽', tone: 'bad' });
      } else still.push(r);
    }
    state.pendingReturns = still;

    // истечение объявлений
    state.listings = state.listings.filter(l => l.status === 'active' && l.expires >= state.day);
    refreshFeed(state, 200);

    // событие режима «Интересный»
    if (modeOf(state).eventChance && chance(modeOf(state).eventChance)) {
      const ev = rollEvent(state);
      events.push({ type: 'event', text: ev.title + ': ' + state.lastEvent.result, tone: ev.good ? 'good' : 'bad' });
    }

    // новые покупатели на свои объявления — каждый день по несколько сообщений
    let msgCount = 0;
    for (const l of state.myListings) {
      l.views += rndInt(6, 26);
      const active = (l.buyers || []).filter(b => b.stage !== 'lost' && b.stage !== 'done').length;
      if (active >= 7) continue;
      const n = active >= 4 ? 1 : rndInt(1, 3);
      for (let i = 0; i < n; i++) { buyerAppears(state, l); msgCount++; }
    }
    if (msgCount) events.push({ type: 'messages', text: 'Новые сообщения по объявлениям: ' + msgCount, tone: '' });

    for (const e of events) pushLog(state, e);
    return events;
  }

  /* ---------- РЕЖИМЫ ---------- */
  const MODES = {
    casual: {
      id: 'casual', name: 'Казуальный', icon: '🌿',
      note: 'Спокойный перекуп: лента, торг, встречи. Без событий и внезапных сюрпризов.',
      eventChance: 0, returnMult: 1
    },
    risky: {
      id: 'risky', name: 'Интересный', icon: '🎲',
      note: 'Каждый день что-то происходит: ажиотаж, скидки мастеров, конкуренты, горящие лоты, мошенники.',
      eventChance: 0.62, returnMult: 1.3
    }
  };

  function modeOf(state) { return MODES[state.mode] || MODES.casual; }

  // активный бонус/штраф от события
  function effect(state, key) {
    const e = state.effects && state.effects[key];
    if (!e || e.until < state.day) return 1;
    return e.v;
  }

  function setEffect(state, key, v, days) {
    state.effects = state.effects || {};
    state.effects[key] = { v: v, until: state.day + (days || 2) };
  }

  /* ---------- СОБЫТИЯ ---------- */
  const EVENTS = [
    {
      id: 'repair', w: 12, good: true, title: 'Мастер даёт скидку',
      text: 'Знакомый мастер в соседнем дворе берёт за ремонт на 35% меньше.',
      apply(state) { setEffect(state, 'repair', 0.65, 2); return 'ремонт дешевле на 35% (2 дня)'; }
    },
    {
      id: 'demand', w: 12, good: true, title: 'Ажиотаж на рынке',
      text: 'Спрос вырос, покупатели готовы платить больше.',
      apply(state) { setEffect(state, 'buyer', 1.12, 2); return 'покупатели платят +12% (2 дня)'; }
    },
    {
      id: 'scrap', w: 7, good: true, title: 'Ломбард скупает дорого',
      text: 'Скупщик на запчасти поднял цены.',
      apply(state) { setEffect(state, 'scrap', 1.9, 2); return 'сдача на запчасти дороже в 1,9 раза (2 дня)'; }
    },
    {
      id: 'viral', w: 9, good: true, title: 'Объявление залетело',
      text: 'Твоё объявление попало в подборку и набрало просмотры.',
      apply(state) {
        if (!state.myListings.length) { state.balance += 1500; return 'нечего продвигать — зато дали 1 500 ₽ бонусом'; }
        const l = state.myListings[Math.floor(rnd() * state.myListings.length)];
        l.views += 120;
        E_buyer(state, l); E_buyer(state, l);
        return '+' + 2 + ' новых покупателя на «' + MODELS_BY_ID[l.modelId].name + '»';
      }
    },
    {
      id: 'hotlot', w: 10, good: true, title: 'Горящий лот',
      text: 'На Авито выскочило объявление, которое отдают почти задаром.',
      apply(state) {
        const l = generateListing(state);
        l.ask = round100(l.value * rndRange(0.5, 0.62));
        l.sellerMin = round100(l.ask * 0.9);
        l.neg.anchor = round100(l.sellerMin * 1.03);
        l.desc = makeDescription(l) + ' Срочно, уезжаю, отдам первому.';
        state.listings.unshift(l);
        return 'в ленте появился лот за ' + l.ask + ' ₽';
      }
    },
    {
      id: 'bonus', w: 8, good: true, title: 'Неожиданные деньги',
      text: 'Вернули старый долг.',
      apply(state) { const s = rndInt(1500, 3500); state.balance += s; return '+' + s + ' ₽'; }
    },
    {
      id: 'competitor', w: 10, good: false, title: 'Перекуп скупил лоты',
      text: 'Конкурент прочёсывает ленту и забирает всё интересное.',
      apply(state) {
        const before = state.listings.length;
        state.listings = state.listings.filter(() => chance(0.62));
        return 'из ленты пропало ' + (before - state.listings.length) + ' объявлений';
      }
    },
    {
      id: 'fine', w: 8, good: false, title: 'Авито списал деньги',
      text: 'Списание за продвижение объявлений.',
      apply(state) {
        const s = Math.min(state.balance, rndInt(800, 2200));
        state.balance -= s;
        return '−' + s + ' ₽';
      }
    },
    {
      id: 'thief', w: 6, good: false, title: 'Купил краденый',
      text: 'Один из аппаратов на складе оказался с «сюрпризом» — IMEI в чёрном списке.',
      apply(state) {
        if (!state.phones.length) { state.balance = Math.max(0, state.balance - 700); return 'склад пуст — отделался штрафом 700 ₽'; }
        const p = state.phones[Math.floor(rnd() * state.phones.length)];
        if (!p.defects.some(d => d.key === 'imei')) p.defects.push({ key: 'imei', found: false, disclosed: false });
        return MODELS_BY_ID[p.modelId].name + ' оказался проблемным';
      }
    },
    {
      id: 'quiet', w: 10, good: true, title: 'Тихий день',
      text: 'На Авито всё спокойно.',
      apply(state) { return 'без последствий'; }
    }
  ];

  function E_buyer(state, listing) { buyerAppears(state, listing); }

  function rollEvent(state) {
    const ev = weighted(EVENTS, 'w');
    const res = ev.apply(state);
    state.lastEvent = { day: state.day, title: ev.title, text: ev.text, result: res, good: ev.good };
    return ev;
  }

  function newGame(mode) {
    const state = {
      version: 1,
      mode: mode || 'casual',
      balance: 5000,
      day: 1,
      rep: 50,
      skill: 10,
      effects: {},
      lastEvent: null,
      deals: [],
      mainPhoneId: null,
      phones: [],
      listings: [],
      myListings: [],
      pendingReturns: [],
      log: [],
      stats: { bought: 0, sold: 0, spent: 0, earned: 0, profit: 0, repairsCost: 0, scrapped: 0, bestDeal: 0, bestModel: null },
      tutorialDone: false
    };
    refreshFeed(state, 200);
    // на старте обязательно должны быть лоты, которые по карману с 5 000 ₽
    const cheapOnes = [];
    const seen = {};
    for (const l of state.listings) seen[l.modelId] = (seen[l.modelId] || 0) + 1;
    let guard = 0;
    while (cheapOnes.length < 6 && guard++ < 900) {
      const avoid = new Set(Object.keys(seen).filter(k => seen[k] >= 2));
      const l = generateListing(state, avoid);
      if (l.ask <= 6500) {
        cheapOnes.push(l);
        seen[l.modelId] = (seen[l.modelId] || 0) + 1;
      }
    }
    // раскидываем дешёвые лоты по верху ленты, чтобы они не шли подряд,
    // но 3 из них гарантированно видны на первом экране
    const first = cheapOnes.slice(0, 3).concat(state.listings.slice(0, 2));
    for (let i = first.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      const t = first[i]; first[i] = first[j]; first[j] = t;
    }
    state.listings = first.concat(cheapOnes.slice(3), state.listings.slice(2));

    // ---------- стартовый телефон: самый дешёвый, он же основной ----------
    // Без телефона работать нельзя: не на что звонить и писать продавцам.
    const starter = makeStarterPhone(state);
    state.phones.push(starter);
    state.mainPhoneId = starter.id;

    pushLog(state, { text: 'Старт: 5 000 ₽ на руках и старенький телефон для связи. Москва, Авито, вперёд.', tone: 'info' });
    pushLog(state, { text: 'Основной телефон продать нельзя — это твой рабочий аппарат.', tone: 'muted' });

/* ============================================================
   MIDE — фото объявлений.
   Фотография модели показывается как есть, со своим фоном.
   Никакого вырезания и никаких подложек.
   ============================================================ */
(function (root) {
  'use strict';

  function url(modelId) {
    const p = root.MODEL_PHOTO && root.MODEL_PHOTO[modelId];
    return p ? 'data:image/webp;base64,' + p : null;
  }

  function ph(modelId, deskIndex, size, cls) {
    const u = url(modelId);
    if (!u) return '<div class="pphoto-empty"></div>';
    return '<img class="pphoto ' + (cls || '') + '" src="' + u + '" alt="">';
  }

  root.PHOTO = { ph: ph, url: url, desks: () => 0 };
})(window);

          // тёмная внутренняя капсула с линзами

  // ---------- лого ----------
  function logoSvg(m, g, bx, by) {
    const cx = bx + g.w / 2;
    const cy = by + g.h * (g.fold ? 0.86 : 0.76);
    const dark = 'rgba(0,0,0,.34)';
    const light = 'rgba(255,255,255,.45)';
    const low = (COLORS[m.color || 'чёрный'][2] < 26);
    const fill = low ? light : dark;
    const txt = function (t, size, weight, letter, c) {
      return '<text x="' + cx.toFixed(1) + '" y="' + cy.toFixed(1) + '" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="' +
        size + '" font-weight="' + (weight || 400) + '" letter-spacing="' + (letter || 0) + '" fill="' + (c || fill) + '">' + t + '</text>';
    };
    switch (m.brand) {
      case 'Apple':
        return '<g transform="translate(' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ')" fill="' + fill + '">' +
          '<ellipse cx="0" cy="0" rx="5.4" ry="6.4"/><path d="M1.2-6c-1 1.4-2.3 1.8-3 1.8.2-1.9 1.6-3.6 3-3.8z"/></g>';
      case 'Samsung': return txt('SAMSUNG', 5.4, 700, 0.5);
      case 'Honor': return txt('HONOR', 5.6, 700, 0.4);
      case 'Huawei': return txt('HUAWEI', 5, 600, 0.5);
      case 'Sony': return txt('SONY', 5.2, 700, 0.7);
      case 'ASUS': return txt('ROG', 5.4, 800, 0.6);
      case 'Google':
        // буква G: кольцо с выноской вправо, как на Pixel
        return '<g transform="translate(' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ')" fill="none" stroke="' + fill +
          '" stroke-width="2.2" stroke-linecap="butt">' +
          '<path d="M5.4 -3.1 A6.2 6.2 0 1 0 6.2 0.2"/>' +
          '<path d="M2.6 0.2 H6.2"/></g>';
      case 'Nothing':
        return '<g transform="translate(' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ')" fill="none" stroke="' + fill + '" stroke-width=".9">' +
          '<circle cx="-4.4" r="2"/><circle cx="4.4" r="2"/></g>';
      case 'OnePlus':
        return '<g transform="translate(' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ')" stroke="' + fill + '" stroke-width="1" fill="none">' +
          '<rect x="-5.4" y="-2.3" width="10.8" height="4.6" rx="2.3"/><path d="M0-1.2v2.4M-1.2 0h2.4"/></g>';
      case 'OPPO':
        return '<ellipse cx="' + cx + '" cy="' + (cy - 1.4) + '" rx="5.8" ry="2.7" fill="none" stroke="' + fill + '" stroke-width="1.1"/>';
      case 'vivo':
        return '<text x="' + cx + '" y="' + cy + '" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="5.8" fill="' + fill + '">vivo</text>';
      case 'realme':
      case 'Realme': return txt('realme', 5.2, 700);
      case 'Xiaomi':
        return '<rect x="' + (cx - 4.8) + '" y="' + (cy - 4.8) + '" width="9.6" height="9.6" rx="2.2" fill="#ff6900"/>' +
          '<text x="' + cx + '" y="' + (cy + 1.9) + '" text-anchor="middle" font-family="Arial,sans-serif" font-size="5.2" font-weight="800" fill="#fff">mi</text>';
      case 'POCO':
        return txt('POCO', 5.4, 800, 0.4, '#ff6900');
      case 'Motorola':
        return '<g transform="translate(' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ')" fill="none" stroke="' + fill + '" stroke-width="1">' +
          '<circle r="4"/><path d="M-1.7 0h3.4"/></g>';
      case 'Tecno':
      case 'Infinix': return txt(m.brand.toUpperCase(), 4.6, 600, 0.4);
      default: return '';
    }

  // ---------- трещины ----------
  function rng(seed) {
    let s = (Math.abs(seed) >>> 0) || 7;
    return function () { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
  }

  function crackSvg(x, y, w, h, seed, strong) {
    const r = rng(seed);
    let d = '';
    const centers = strong ? 3 : 2;
    for (let c = 0; c < centers; c++) {
      const cx = x + w * (0.15 + r() * 0.7), cy = y + h * (0.18 + r() * 0.64);
      const rays = 6 + (r() * 4 | 0);
      for (let i = 0; i < rays; i++) {
        let px = cx, py = cy, ang = r() * Math.PI * 2;
        d += 'M' + px.toFixed(1) + ' ' + py.toFixed(1);
        const len = (strong ? 20 : 13) + r() * 12;
        const steps = 3 + (r() * 3 | 0);
        for (let k = 0; k < steps; k++) {
          ang += (r() - 0.5) * 0.65;
          px = Math.min(x + w - 1, Math.max(x + 1, px + Math.cos(ang) * len / steps));
          py = Math.min(y + h - 1, Math.max(y + 1, py + Math.sin(ang) * len / steps));
          d += ' L' + px.toFixed(1) + ' ' + py.toFixed(1);
        }
      }
    }
    return '<path d="' + d + '" fill="none" stroke="rgba(240,252,255,.85)" stroke-width=".75" stroke-linecap="round"/>' +
      '<path d="' + d + '" fill="none" stroke="rgba(120,200,255,.2)" stroke-width="1.9" stroke-linecap="round"/>';
  }

  function scratchSvg(x, y, w, h, seed) {
    const r = rng(seed + 91);
    let d = '';
    for (let i = 0; i < 8; i++) {
      const px = x + r() * w, py = y + r() * h;
      d += 'M' + px.toFixed(1) + ' ' + py.toFixed(1) + 'l' + ((r() - .5) * w * .4).toFixed(1) + ' ' + ((r() - .5) * h * .1).toFixed(1);
    }
    return '<path d="' + d + '" fill="none" stroke="rgba(255,255,255,.45)" stroke-width=".65" stroke-linecap="round"/>';
  }

  let seq = 0;

  function draw(m, color, opts) {
    opts = opts || {};
    const side = opts.side || 'back';
    const defects = opts.defects || [];
    const seed = (opts.seed || 1) + 17;
    const uid = 'p' + (++seq);
    const g = shapeOf(m);
    const mat = MATERIAL[materialOf(m, color)];
    const bx = (100 - g.w) / 2, by = (150 - g.h) / 2;
    const b = COLORS[color] || COLORS['синий'];
    const hue = b[0], sat = b[1], light = b[2];

    const c1 = 'hsl(' + hue + ',' + Math.max(3, sat - 8) + '%,' + Math.min(95, light + 24) + '%)';
    const c2 = 'hsl(' + hue + ',' + sat + '%,' + light + '%)';
    const c3 = 'hsl(' + hue + ',' + Math.max(3, sat - 3) + '%,' + Math.max(5, light - 15) + '%)';
    const s = [];

    s.push('<svg class="psvg" viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">');
    s.push('<defs>');
    s.push('<linearGradient id="' + uid + 'b" x1="0" y1="0" x2=".85" y2="1">' +
      '<stop offset="0" stop-color="' + c1 + '"/><stop offset=".45" stop-color="' + c2 + '"/>' +
      '<stop offset="1" stop-color="' + c3 + '"/></linearGradient>');
    s.push('<linearGradient id="' + uid + 'k" x1=".1" y1="0" x2=".9" y2="1">' +
      '<stop offset="0" stop-color="#1c2634"/><stop offset=".55" stop-color="#06090d"/>' +
      '<stop offset="1" stop-color="#111a24"/></linearGradient>');
    s.push('<clipPath id="' + uid + 'c"><rect x="' + bx + '" y="' + by + '" width="' + g.w +
      '" height="' + g.h + '" rx="' + g.r + '"/></clipPath>');
    s.push('</defs>');

    s.push('<rect x="' + bx + '" y="' + by + '" width="' + g.w + '" height="' + g.h + '" rx="' + g.r +
      '" fill="url(#' + uid + 'b)" stroke="rgba(0,0,0,.45)" stroke-width=".5"/>');

    if (side === 'back') back(s, m, g, bx, by, mat, hue, uid, defects, seed);
    else front(s, m, g, bx, by, uid, defects, seed);

    s.push('</svg>');
    return s.join('');
  }

  function back(s, m, g, bx, by, mat, hue, uid, defects, seed) {
    s.push('<rect x="' + (bx + 1) + '" y="' + (by + 1) + '" width="' + (g.w - 2) + '" height="' + (g.h - 2) +
      '" rx="' + (g.r - 1) + '" fill="none" stroke="' + mat.edge + '" stroke-width=".65"/>');
    s.push('<g clip-path="url(#' + uid + 'c)"><path d="M' + bx + ' ' + (by + g.h * .06) + ' L' +
      (bx + g.w) + ' ' + (by - g.h * .08) + ' L' + (bx + g.w) + ' ' + (by + g.h * .28) + ' Z" fill="rgba(255,255,255,' +
      mat.sheen + ')"/></g>');

    if (g.fold) {
      if (g.fold === 'clamshell') {
        const my = by + g.h / 2;
        s.push('<line x1="' + (bx + 2) + '" y1="' + my + '" x2="' + (bx + g.w - 2) + '" y2="' + my + '" stroke="rgba(0,0,0,.38)" stroke-width="1"/>');
        s.push('<line x1="' + (bx + 2) + '" y1="' + (my + 1.4) + '" x2="' + (bx + g.w - 2) + '" y2="' + (my + 1.4) + '" stroke="rgba(255,255,255,.16)" stroke-width=".7"/>');
      } else if (g.spec.cam === 'pixel9Fold') {
        // у Pixel Fold спинку не режет линия: сгиб тоньше и прерывается под камерой
        const fx = bx + g.w / 2;
        s.push('<line x1="' + fx + '" y1="' + (by + g.h * .55) + '" x2="' + fx + '" y2="' + (by + g.h * .78) +
          '" stroke="rgba(0,0,0,.16)" stroke-width=".8"/>');
      } else {
        const fx = bx + g.w / 2;
        s.push('<line x1="' + fx + '" y1="' + (by + 2) + '" x2="' + fx + '" y2="' + (by + g.h * .62) + '" stroke="rgba(0,0,0,.38)" stroke-width="1"/>');
        s.push('<line x1="' + (fx + 1.3) + '" y1="' + (by + 2) + '" x2="' + (fx + 1.3) + '" y2="' + (by + g.h * .62) + '" stroke="rgba(255,255,255,.14)" stroke-width=".7"/>');
      }
    }

    s.push(cameraSvg(m, g, bx, by, hue));
    s.push(logoSvg(m, g, bx, by));

    const plastic = /^Galaxy A|Redmi|POCO|Moto|Camon|Note ?50|Edge|CMF|Realme/.test(m.name);
    if (!plastic && defects.indexOf('back') >= 0) s.push(crackSvg(bx + 5, by + g.h * .3, g.w - 10, g.h * .58, seed, false));
    if (defects.indexOf('frame') >= 0 || (plastic && defects.indexOf('back') >= 0)) s.push(scratchSvg(bx + 5, by + g.h * .32, g.w - 10, g.h * .6, seed));
    if (defects.indexOf('water') >= 0) {
      s.push('<ellipse cx="' + (bx + g.w * .34).toFixed(1) + '" cy="' + (by + g.h * .72).toFixed(1) + '" rx="8" ry="5.5" fill="rgba(190,155,70,.18)"/>');
      s.push('<ellipse cx="' + (bx + g.w * .63).toFixed(1) + '" cy="' + (by + g.h * .6).toFixed(1) + '" rx="5.5" ry="4" fill="rgba(190,155,70,.14)"/>');
    }
  }

  function front(s, m, g, bx, by, uid, defects, seed) {
    const ix = bx + 2, iy = by + 2, iw = g.w - 4, ih = g.h - 4;
    const rr = Math.max(4, g.r - 1.5);
    s.push('<defs><clipPath id="' + uid + 'e"><rect x="' + ix + '" y="' + iy + '" width="' + iw + '" height="' + ih + '" rx="' + rr + '"/></clipPath></defs>');
    s.push('<rect x="' + ix + '" y="' + iy + '" width="' + iw + '" height="' + ih + '" rx="' + rr + '" fill="url(#' + uid + 'k)"/>');
    s.push('<g clip-path="url(#' + uid + 'e)">');
    s.push('<ellipse cx="' + (ix + iw * .5).toFixed(1) + '" cy="' + (iy + ih * .68).toFixed(1) + '" rx="' + (iw * .55).toFixed(1) + '" ry="' + (ih * .36).toFixed(1) + '" fill="rgba(52,92,198,.5)"/>');
    s.push('<ellipse cx="' + (ix + iw * .34).toFixed(1) + '" cy="' + (iy + ih * .2).toFixed(1) + '" rx="' + (iw * .3).toFixed(1) + '" ry="' + (ih * .15).toFixed(1) + '" fill="rgba(176,62,148,.3)"/>');
    s.push('<text x="' + (ix + 3) + '" y="' + (iy + 7).toFixed(1) + '" font-family="Arial,sans-serif" font-size="3.1" fill="rgba(255,255,255,.85)">9:41</text>');
    s.push('<rect x="' + (ix + iw - 9).toFixed(1) + '" y="' + (iy + 4) + '" width="4.4" height="3" rx=".8" fill="rgba(255,255,255,.8)"/>');
    s.push('<rect x="' + (ix + iw - 15).toFixed(1) + '" y="' + (iy + 5) + '" width="4" height="2.4" rx=".6" fill="rgba(255,255,255,.5)"/>');

    const cols = 4, rows = 3, pad = 5;
    const cw = (iw - pad * (cols + 1)) / cols;

        const unknownCount = p.defects.length - known.length;
        html += '<div class="stock-item" data-act="open-phone" data-id="' + p.id + '">' +
          '<div class="stock-top"><div class="thumb">' + thumbHTML(m, p.color) + '</div>' +

      box.innerHTML = html;
    },

    /* ---------- мои объявления ---------- */
    renderListings() {
      const box = $('#view-listings');
      const ls = this.state.myListings;
      let html = '<div class="section-title">Мои объявления <span class="hint">' + ls.length + '</span></div>';
      if (!ls.length) {
        html += '<div class="empty"><b>Ничего не выставлено</b><p>Заходи в склад, выбирай телефон и жми «Выставить на Авито».</p></div>';
        box.innerHTML = html;
        return;
      }
      for (const l of ls) {
        const m = E.MODELS_BY_ID[l.modelId];
        const buyers = (l.buyers || []).filter(b => b.stage !== 'lost' && b.stage !== 'done');
        const unread = buyers.filter(b => !b.seen).length;
        const last = buyers[buyers.length - 1];
        html += '<div class="stock-item" data-act="open-sell" data-id="' + l.id + '">' +

          '<div class="stock-info">' +
          '<div class="nm">' + esc(m.name) + ' ' + l.storage + ' ГБ</div>' +
          '<div class="sub">' + money(l.ask) + ' · 👁 ' + l.views + ' · ' + buyers.length + ' пишут</div>' +
          '<div class="stock-defects" style="margin-top:6px">' +
          (l.defects.length ? l.defects.map(d => '<span class="dtag bad">' + esc(D.DEFECTS[d.key].short) + '</span>').join('') : '<span class="dtag ok">без дефектов</span>') +

    /* ---------- журнал ---------- */
    renderLog() {

              '<div class="txn-profit ' + (d.profit >= 0 ? 'pos' : 'neg') + '">' + (d.profit >= 0 ? '+' : '') + money(d.profit) + '</div>'

      '<div class="btn-row"><button class="btn sm primary" id="btn-key-save">Сохранить</button>' +

      (location.protocol === 'file:'

        : '') +

      '<button class="btn sm ghost" id="btn-mode" style="width:auto">Сменить</button></div>' +
      '</div>' +
      '<div class="stock-item mt12">' +
      '<div class="row"><div class="txt"><b>Прогресс</b><span>День ' + s.day + ', профит ' + money(s.stats.profit) + ', сделок ' + s.stats.sold + '</span></div></div>' +
      '<div class="btn-row mt8"><button class="btn sm ghost" id="btn-export">Скопировать сейв</button>' +
      '<button class="btn sm danger" id="btn-reset">Начать заново</button></div>' +

      '<div class="tiny muted mt12" style="text-align:center">v0.2 · Москва · ' + D.MODELS.length + ' моделей в каталоге, из них ' + D.MODELS.filter(m => m.fold).length + ' складных</div>' +
      '</div>';
    ov.classList.add('open');

    $('#btn-key-save').onclick = () => {
      const k = $('#inp-key').value.trim();
      root.AI.setKey(k);

      $('#key-status').textContent = k ? 'ключ сохранён' : 'ключ очищен';
      $('#key-status').className = 'key-status ' + (k ? 'ok' : '');
      $('#sw-ai').classList.toggle('on', root.AI.available());
      App.state.hideAiBanner = false;
      App.render();
      App.toast(k ? 'Ключ сохранён, диалоги оживут' : 'Ключ убран, работаем на шаблонах', k ? 'good' : '');

      if (root.AI.available()) {
        root.AI.setKey('');

        $('#key-status').className = 'key-status';
        $('#sw-ai').classList.remove('on');

        $('#inp-key').focus();

    $('#btn-key-test').onclick = async () => {
      const k = $('#inp-key').value.trim();
      root.AI.setKey(k);
      const st = $('#key-status');
      st.textContent = 'проверяю...';
      st.className = 'key-status';
      const r = await root.AI.chat([{ role: 'user', content: 'Ответь одним словом: привет' }], { maxTokens: 10, timeout: 15000 });
      if (r.ok) {
        st.textContent = 'работает: «' + r.content.slice(0, 40) + '»';
        st.className = 'key-status ok';
        try { localStorage.setItem(KEY_KEY, k); } catch (e) { }
        $('#sw-ai').classList.add('on');
      } else {
        st.textContent = 'ошибка: ' + (r.error || 'неизвестно');
        st.className = 'key-status bad';

    };
    if ($('#btn-mode')) $('#btn-mode').onclick = () => { App.closeOv('settings'); App.modeModal(false); };
    $('#btn-export').onclick = () => {
      const txt = JSON.stringify(App.state);
      navigator.clipboard && navigator.clipboard.writeText(txt);
      App.toast('Сейв скопирован в буфер', 'good');
    };
  };

  root.App = App;
  App.phoneSVG = phoneSVG;
  document.addEventListener('DOMContentLoaded', () => App.init());

/* ===== flows.js ===== */
/* ============================================================
   AVITO FLIP — сценарии: объявление, чат, встреча, ремонт, продажа
   ============================================================ */
(function (root) {
  'use strict';

  const D = root.DATA;
  const E = root.Engine;
  const AI = root.AI;
  const App = root.App;

  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = n => new Intl.NumberFormat('ru-RU').format(Math.round(n || 0)) + ' ₽';
  const delay = ms => new Promise(r => setTimeout(r, ms));

  App.cur = null;
  App.busy = false;

  /* ============================================================
     ОБЩЕЕ: сообщения
     ============================================================ */
  function pushMsg(chat, who, text, kind) {
    chat.push({ who: who, text: text, kind: kind || null, t: Date.now() });
    return chat[chat.length - 1];
  }

  function msgHTML(m) {
    if (m.who === 'sys') return '<div class="msg sys ' + (m.kind || '') + '">' + esc(m.text) + '</div>';
    return '<div class="msg ' + (m.who === 'me' ? 'me' : 'them') + '">' + esc(m.text) + '</div>';
  }

  function renderChatBox() {
    const box = $('#chat-box');
    if (!box) return;
    const chat = App.cur.chat;
    box.innerHTML = chat.map(msgHTML).join('');
    box.scrollTop = box.scrollHeight;
  }

  function addTyping() {
    const box = $('#chat-box');
    if (!box) return null;
    const n = document.createElement('div');
    n.className = 'msg them typing-wrap';
    n.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    box.appendChild(n);
    box.scrollTop = box.scrollHeight;
    return n;
  }
  function removeTyping(n) { if (n && n.parentNode) n.remove(); }

  async function withTyping(fn) {
    const t = addTyping();
    let res;
    try { res = await fn(); } catch (e) { res = null; }
    await delay(220);
    removeTyping(t);
    return res;
  }

  /* ============================================================
     ЭКРАН ОБЪЯВЛЕНИЯ
     ============================================================ */

  /* ---------- галерея фото ---------- */
  App.galleryHTML = function (m, listing) {
    const defs = (listing.defects || []).filter(d => d.disclosed).map(d => d.key);
    const seed = (listing.id || '').split('').reduce((s, c) => s + c.charCodeAt(0), 0);
    return '<div class="gallery" id="gallery">' +
      '<div class="gallery-view" id="gal-view">' +
      '<div class="slide">' + App.photoHTML(m, listing, defs, seed) + '</div>' +
      '<div class="slide">' + App.backHTML(m, listing.color, defs, seed) + '</div>' +
      '</div>' +
      '<div class="gallery-nav"><button id="gal-prev">‹</button><button id="gal-next">›</button></div>' +
      '<div class="gallery-dots"><i class="on"></i><i></i></div>' +
      '<div class="gallery-count">1 / ' + (listing.photos || 2) + '</div>' +
      '</div>';
  };


  // фото объявления: как есть, со своим фоном, без вырезки
  App.photoHTML = function (m) {
    return '<div class="listing-photo">' + root.PHOTO.ph(m.id) + '</div>';
  };

  App.frontHTML = function (m, color, defects, seed) {
    return App.phoneSVG(m, color, { side: 'front', defects: defects || [], seed: seed });
  };

  App.backHTML = function (m, color, defects, seed) {
    return App.phoneSVG(m, color, { side: 'back', defects: defects || [], seed: seed });
  };

  App.overlayDefects = function (m, defects, seed) {
    const glass = !/A\d\d|Redmi|POCO|Moto|Camon|Note 50|Edge/.test(m.name);
    const hasCrack = defects.indexOf('back') >= 0 && glass;
    const hasScratch = defects.indexOf('frame') >= 0 || (defects.indexOf('back') >= 0 && !glass);
    if (!hasCrack && !hasScratch && defects.indexOf('water') < 0) return '';
    let svg = '<svg viewBox="0 0 100 150" preserveAspectRatio="none" class="def-layer">';
    let s2 = seed || 7;
    const rnd = () => { s2 = (s2 * 9301 + 49297) % 233280; return s2 / 233280; };
    if (hasCrack) {
      for (let i = 0; i < 8; i++) {
        const x = 18 + rnd() * 64, y = 12 + rnd() * 120;
        svg += '<path d="M' + x + ' ' + y + 'l' + (rnd() * 26 - 13).toFixed(1) + ' ' + (rnd() * 26 - 13).toFixed(1) + '" stroke="rgba(255,255,255,.75)" stroke-width=".8" fill="none"/>';
      }
    }
    if (hasScratch) {
      for (let i = 0; i < 10; i++) {
        const x = 15 + rnd() * 70, y = 10 + rnd() * 125;
        svg += '<path d="M' + x.toFixed(1) + ' ' + y.toFixed(1) + 'l' + (rnd() * 18 - 9).toFixed(1) + ' ' + (rnd() * 18 - 9).toFixed(1) + '" stroke="rgba(200,200,200,.5)" stroke-width=".6"/>';
      }
    }
    if (defects.indexOf('water') >= 0) {
      for (let i = 0; i < 4; i++) {
        svg += '<ellipse cx="' + (25 + rnd() * 50).toFixed(1) + '" cy="' + (90 + rnd() * 40).toFixed(1) + '" rx="' + (5 + rnd() * 8).toFixed(1) + '" ry="' + (4 + rnd() * 6).toFixed(1) + '" fill="rgba(190,150,60,.25)"/>';
      }
    }
    return svg + '</svg>';
  };

  App.bindGallery = function () {
    const view = document.getElementById('gal-view');
    if (!view) return;
    let i = 0;
    const dots = document.querySelectorAll('.gallery-dots i');
    const move = (n) => {
      i = n;
      view.style.transform = 'translateX(' + (-i * 100) + '%)';
      dots.forEach((d, k) => d.classList.toggle('on', k === i));
      const c = document.querySelector('.gallery-count');
      if (c) c.textContent = (i + 1) + ' / 2';
    };
    const prev = document.getElementById('gal-prev');
    const next = document.getElementById('gal-next');
    if (prev) prev.onclick = () => move(Math.max(0, i - 1));
    if (next) next.onclick = () => move(Math.min(1, i + 1));
    let sx = null;
    view.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
    view.addEventListener('touchend', e => {
      if (sx === null) return;
      const dx = e.changedTouches[0].clientX - sx;
      if (Math.abs(dx) > 40) move(dx < 0 ? 1 : 0);
      sx = null;
    }, { passive: true });
  };

  App.openListing = function (id) {
    const l = this.state.listings.find(x => x.id === id);
    if (!l) return;
    this.cur = { kind: 'buy', listing: l };
    const m = E.MODELS_BY_ID[l.modelId];
    const ov = $('#ov-listing');
    const city = l.isMoscow ? l.city + ', м. ' + l.metro : l.city;

    const facts = [
      '<span class="pill blue">' + l.storage + ' ГБ</span>',
      '<span class="pill">' + esc(l.color) + '</span>',
      '<span class="pill">' + esc(D.TIER_NAMES[m.tier]) + '</span>',
      m.code ? '<span class="pill" style="font-family:ui-monospace,monospace">' + esc(m.code) + '</span>' : '',
      m.fold ? '<span class="pill" style="background:#f1ecff;color:#7c5cff">складной</span>' : '',
      '<span class="pill">' + esc(l.seller.typeName) + '</span>'
    ].join('');

    const mkt = E.advertisedValue(l);
    const diff = mkt - l.ask;
    const mktLine = '<div class="mkt-line"><span>Рынок для такого состояния ≈ <b>' + money(mkt) + '</b></span>' +
      (diff > 0
        ? '<b class="pos">выгода ' + money(diff) + ' (−' + Math.round(diff / mkt * 100) + '%)</b>'
        : diff < 0
          ? '<b class="neg">переплата ' + money(-diff) + '</b>'
          : '<b>ровно по рынку</b>') + '</div>';

    const shownDefects = l.defects.filter(d => d.disclosed);
